<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-Work 임시 DB 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#584C9D;--p-d:#3F3578;--p-soft:#EEECF7;--t:#25B7AA;--t-soft:#E6F7F5;--t-ink:#0B5C55;
  --bg:#F7F7FB;--surface:#FFFFFF;--surface-2:#F3F2F9;--line:#E3E1EE;--line-2:#EDEBF4;
  --ink:#22212B;--ink-2:#5F5C72;--ink-3:#8A879B;
  --bad:#B42318;--bad-soft:#FDECEA;--warn:#8A5100;--warn-soft:#FEF3DC;--ok:#0F6E66;--ok-soft:#E3F5F2;
  --spec:#C2410C;--spec-soft:#FFF4EC;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grow{flex:1}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* top */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;background:var(--p);color:#fff}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:16px}
.brand span{font-size:13px}
.brand em{font-style:normal;font-size:11px;border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:0 6px}
.seg{display:inline-flex;border:1px solid #D9D6E6;border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;font-size:13px;color:var(--ink-2);min-height:34px}
.seg button.on{background:var(--p);color:#fff;font-weight:600}
.seg.inv{border-color:rgba(255,255,255,.6);background:transparent}
.seg.inv button{color:#fff}
.seg.inv button.on{background:#fff;color:var(--p)}
.spec-tg{display:flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.12);border-radius:6px;padding:5px 10px;cursor:pointer}
.spec-tg input{margin:0;accent-color:#fff;width:15px;height:15px}
.who{font-size:13px}
.tbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:5px 11px;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.12)}
.absbar{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid #F1D49A;padding:6px 20px;font-size:13px}

/* shell */
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 54px)}
.nav{flex:1 1 200px;max-width:224px;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px 30px}
.nav .grp{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;padding:16px 10px 4px}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px;color:#3D3A4E}
.nav button:hover{background:var(--p-soft);color:var(--p)}
.nav button.sub{padding-left:24px;font-size:13px;color:var(--ink-2)}
.nav button.on{background:var(--p);color:#fff;font-weight:600}
.nav .cnt{font-family:var(--mono);font-size:12px}
.nav .lab{padding:8px 10px;font-size:14px;color:#3D3A4E}
main{flex:999 1 600px;min-width:0;padding:20px 24px 60px;display:flex;flex-direction:column;gap:14px}
body.spec main{padding-right:24px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.hd h1{margin:0;font-size:21px;font-weight:700}
.hd p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.hd .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #D9D6E6;background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;min-height:34px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--p-d)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:#F2B8B2}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:#C9C4DF;text-underline-offset:3px;font-size:inherit}
.linkbtn:hover{color:var(--p)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbar select,.fbar input[type=search]{border:1px solid #D9D6E6;border-radius:6px;padding:6px 9px;font-size:13px;background:var(--surface);min-height:34px}
.fbar input[type=search]{width:150px}
.fbar label.cb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--p);border-bottom-color:var(--p)}
.tabs .c{font-family:var(--mono);font-size:12px;margin-left:5px;font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.stat b{font-family:var(--mono);font-size:21px;font-weight:600}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.bad b{color:var(--bad)}
.split{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.lst{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 250px)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.t th{position:sticky;top:0;z-index:1;text-align:left;background:var(--surface-2);color:#4A4560;font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:#FAFAFD}
.t tr.sel td{background:var(--p-soft)!important}
.t td.grp{background:var(--surface);vertical-align:top;border-right:1px solid var(--line-2);cursor:default}
.t tr.gs td{border-top:2px solid var(--line)}
.t td.c{text-align:center}
.t td.r{text-align:right}
.t td.wrap{white-space:normal;min-width:180px}
.t tr.dim td{color:var(--ink-3)}
.t input[type=checkbox],.ck input{width:16px;height:16px;margin:0;accent-color:var(--p);vertical-align:middle}
.t select.inl{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 4px;font-size:13px}
.t select.inl:hover{border-color:#D9D6E6;background:#fff}
.dt{display:block;font-size:11px;color:var(--ink-2);font-family:var(--mono)}
.b{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;background:#F0EFF5;color:#4A4560;white-space:nowrap}
.b.bad{background:var(--bad-soft);color:var(--bad)}.b.warn{background:var(--warn-soft);color:var(--warn)}.b.ok{background:var(--ok-soft);color:var(--ok)}.b.p{background:var(--p-soft);color:var(--p)}.b.t{background:var(--t-soft);color:var(--t-ink)}
.gname{display:flex;flex-direction:column;gap:2px}
.gname small{font-size:11px;color:var(--ink-2)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-2);margin:0}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--p);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px}
.bulk .btn{color:var(--ink)}
.bulk .x{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px}
.bulk.off{background:var(--surface-2);color:var(--ink-2)}
.bar{display:flex;gap:2px;width:84px}
.bar i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.bar i.d{background:var(--t)}

/* panel */
.pnl{flex:1 1 360px;max-width:520px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 16px 10px}
.ph h2{margin:0;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.ph .k{font-size:12px;color:var(--ink-2)}
.ph .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.close{border:0;background:none;font-size:20px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--ink-2)}
.close:hover{background:var(--surface-2)}
.ps{padding:13px 16px;border-top:1px solid var(--line-2)}
.ps h3{margin:0 0 9px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.miss{margin:0 16px 10px;display:flex;flex-direction:column;gap:6px}
.miss .row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--warn-soft);border:1px solid #F1D49A;border-radius:8px;padding:8px 11px;font-size:13px;color:#6B3F00}
.miss .fix{display:flex;gap:6px;align-items:center;background:#FFFBF2;border:1px solid #F1D49A;border-radius:8px;padding:8px 11px}
.miss .fix input,.miss .fix select{flex:1;min-width:0;border:1px solid #D9D6E6;border-radius:6px;padding:5px 8px;font-size:13px}
.redbox{margin:0 16px 10px;background:var(--bad-soft);border:1px solid #F2B8B2;border-radius:8px;padding:8px 11px;font-size:13px;color:#8C1D15}
.notebox{margin:0 16px 10px;background:var(--t-soft);border:1px solid #A9E2DC;border-radius:8px;padding:8px 11px;font-size:13px;color:var(--t-ink)}
.notebox b{display:block;font-size:11px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.kv>div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--ink-2)}
.kv b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.fg .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}
.f input,.f select,.f textarea{border:1px solid #D9D6E6;border-radius:6px;padding:6px 8px;font-size:14px;color:var(--ink);background:#fff;min-height:34px;width:100%}
.f textarea{min-height:68px;resize:vertical}
.f.req>span::after{content:" *";color:var(--bad)}
.f.err input,.f.err select{border-color:var(--bad);background:#FFF8F7}
.f small{font-size:11px;color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.steps li:last-child{border-bottom:0}
.steps .no{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);background:#fff;padding:0}
.steps li.d .no{background:var(--t);border-color:var(--t);color:#fff}
.steps li.n .no{border-color:var(--p);color:var(--p)}
.steps .lb{font-size:13px}
.steps .lb small{display:block;font-size:11px;color:var(--ink-2)}
.steps .rt{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.steps li.n .lb{font-weight:600;color:var(--p)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.memo{padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.memo small{display:block;font-size:11px;color:var(--ink-2)}
.log{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;font-size:12px;color:var(--ink-2);padding:4px 0;border-bottom:1px dashed var(--line-2)}
.log b{color:var(--ink);font-weight:500}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.emp{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.emp.cur{border-color:var(--p)}
.emp table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.emp td{padding:4px 3px;border-top:1px solid var(--line-2)}
.ptabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 10px}
.ptabs button{border:0;background:none;padding:7px 9px;font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button.on{color:var(--p);border-bottom-color:var(--p)}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{text-align:left;font-size:11px;color:var(--ink-2);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--line)}
.mini td{padding:5px 4px;border-bottom:1px solid var(--line-2)}
.mini select,.mini input{border:1px solid #D9D6E6;border-radius:5px;padding:3px 5px;font-size:12px;width:100%;min-width:0;background:#fff}
.pw{display:flex;gap:8px;align-items:center;background:var(--t-soft);border:1px solid #A9E2DC;border-radius:8px;padding:10px 12px}
.pw code{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--t-ink);flex:1}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,40,.38);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25)}
#gate{position:fixed;inset:0;background:var(--bg);z-index:70;display:grid;place-items:center;padding:16px}
#gate .dlg{box-shadow:0 8px 30px rgba(0,0,0,.08)}
.err{color:var(--bad);font-size:13px;min-height:1em;margin-top:6px}
#savest{font-size:12px;opacity:.9;min-width:60px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100vw - 32px)}

/* spec mode */
.specd{flex:1 1 340px;max-width:400px;background:var(--spec-soft);border-left:1px solid #F5C9A8;padding:14px 14px 40px;font-size:13px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto}
.specd h2{margin:0 0 4px;font-size:15px;color:var(--spec)}
.specd p.s{margin:0 0 10px;font-size:12px;color:#7A4A2A}
.specd .it{background:#fff;border:1px solid #F5C9A8;border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.specd .it:hover{border-color:var(--spec)}
.specd .it .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--spec);color:#fff;font-size:11px;font-weight:700;margin-right:6px;padding:0 5px}
.specd .it b{font-size:13px}
.specd .it p{margin:5px 0 0;color:var(--ink);line-height:1.55}
.specd .it .db{margin-top:5px;font-family:var(--mono);font-size:11px;color:#7A4A2A;background:#FFF0E3;border-radius:4px;padding:3px 6px;overflow-wrap:anywhere}
.specd .sub{font-size:11px;font-weight:700;color:#7A4A2A;letter-spacing:.05em;margin:14px 0 6px}
body.spec [data-spec]:not([data-spec=""]){position:relative;outline:1px dashed rgba(194,65,12,.55);outline-offset:1px}
body.spec [data-spec]:not([data-spec=""])::after{content:attr(data-spec);position:absolute;top:1px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--spec);color:#fff;font:700 10px/17px var(--font);text-align:center;z-index:6;pointer-events:none}
body.spec .flash{animation:fl 1.2s ease 2}
@keyframes fl{50%{outline:3px solid var(--spec);outline-offset:3px}}
@media (prefers-reduced-motion:reduce){body.spec .flash{animation:none;outline:3px solid var(--spec)}}
.dbmap table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
.dbmap th,.dbmap td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.dbmap th{background:var(--surface-2);font-weight:600}
.dbmap code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.rel .n{border:1px solid var(--p);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:12px;color:var(--p);background:var(--p-soft)}
.rel .a{color:var(--ink-2);font-size:12px}

/* ---- v2: 상세 창(모달) · 표 정렬/필터/페이지 · 콤보 · 툴팁 ---- */
.pnl-bg,.ov2,.ov3{position:fixed;inset:0;background:rgba(20,18,40,.38)}
.pnl-bg{z-index:30}.ov2{z-index:40;background:rgba(20,18,40,.3)}.ov3{z-index:50;background:rgba(20,18,40,.3)}
.pnl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1080px,calc(100vw - 32px));max-width:none;max-height:calc(100vh - 48px);overflow:auto;z-index:31;box-shadow:0 18px 50px rgba(0,0,0,.24);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;flex:none}
.pnl.pnl2{z-index:41;width:min(1040px,calc(100vw - 56px));transform:translate(-50%,calc(-50% + 10px));min-height:min(640px,calc(100vh - 48px))}
.pnl.pnl3{z-index:51;width:min(980px,calc(100vw - 80px));transform:translate(-50%,calc(-50% + 20px));grid-template-columns:minmax(0,1fr);min-height:min(600px,calc(100vh - 48px))}
.pnl>.ph,.pnl>.miss,.pnl>.redbox,.pnl>.notebox,.pnl>.ptabs,.pnl>.ps.wide,.pnl>.ps.foot{grid-column:1/-1}
.pnl>.ph{position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:1px solid var(--line-2)}
.pnl>.ps{border-top:0;border-bottom:1px solid var(--line-2)}
.pnl>.ps:nth-of-type(odd){border-right:1px solid var(--line-2)}
.pnl.pnl3>.ps{border-right:0}
.pnl>.ps.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:3}
.contents{display:contents}
.pnl .miss,.pnl .redbox,.pnl .notebox{margin-top:10px}
body.modal-open{overflow:hidden}
@media (max-width:900px){.pnl,.pnl.pnl2,.pnl.pnl3{grid-template-columns:minmax(0,1fr);top:0;transform:translateX(-50%);width:100vw;max-height:100vh;min-height:0;border-radius:0}.pnl>.ps{border-right:0!important}}
.lbl{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.th-b{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:600;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.th-b i{font-style:normal;font-size:10px;color:var(--ink-3)}
.th-b.act{color:var(--p)}.th-b.act i{color:var(--p)}
.th-b .fc{background:var(--p);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;line-height:16px}
#pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:8px;width:240px;max-height:360px;overflow:auto;font-size:13px}
#pop .poph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#pop .popq{width:100%;border:1px solid #D9D6E6;border-radius:5px;padding:4px 7px;margin-bottom:6px;font-size:12px}
#pop .popl label{display:flex;gap:7px;align-items:center;padding:4px 4px;border-radius:5px;cursor:pointer}
#pop .popl label:hover{background:var(--p-soft)}
#pop .popl span{flex:1;overflow-wrap:anywhere}

  return DB.employments.filter(function(e){return activeEmp(e)&&termsOf(e.id)[0]&&termsOf(e.id)[0].start<=addD(TODAY,30)}).map(function(e){
    var z=disOf(e.id),w=wk(e.worker),d=z&&!z.permanent&&z.recheck?dd(TODAY,z.recheck):null;
    if(w&&w.non_dis)return{e:e,z:z,d:null,g:"nondis",w:w};
    if(disRefused(z))return{e:e,z:z,d:d,g:"refuse",w:w};

    return{e:e,z:z,d:d,g:g,w:w};

  ["4","보기 방식","근로자별: 같은 근로자 과업을 한 묶음(근로자 · 기업 칸 병합), 묶음은 가장 급한 마감일 순. 일자별: 기한 경과 → 날짜별 구역. 업무별: 업무 영역 · 구분별 구역(계약 진행 영역: 계약만료 결정 · 계약 진행 · 입사서류 · 퇴사 서류 / 근로자 관리 영역: 장애 재판정 / 고객사 영역: 고객사 요청). 구역 제목을 누르면 접고 펼침. ‘같은 근로자 묶기’를 켜면 구역 안에서 병합.","—"],
  ["5","마감 (정렬)","헤더를 누르면 마감일 오름차순 ↔ 내림차순. 최종 마감일이 있으면 그 값, 없으면 기본 마감일.","todos.final_due ?? default_due"],
  ["6","구분 · 과업 (6종)","계약 진행: 진행 건에 미체크 단계 / 계약만료 결정: 만료 D-30 이내 + 최종 미확정(고객사 결정 확인 → 근로자 수락 확인 → 최종 결정 확정). 고객사가 연장했는데 근로자가 응답 없음이면 만료 D-7(설정)부터 ‘재알림’ 표시, 마감일을 그날로 당김 / 입사서류: 서류 1건당 1과업 / 퇴사 서류: 서류 1건당 1과업 / 장애 재판정: 재판정일 60일 이내(마감 = 재판정일 -30일, 설정), 새 재판정일 저장 또는 영구장애로 종료 / 고객사 요청: 완료 아님. 한 행 = 과업 1건.","expiry_checks · case_documents · exit_documents · disability_checks · client_requests"],
  ["7","기업 · 대무 · 필수값 누락","기업명을 누르면 기업 정보 창이 위에 열림(화면 이동 없음). 대무 = 원 담당자 부재로 넘어온 과업. 필수값 누락 = 그 기업의 필수 6개 중 빈값이 있으면 배지 표시, 마우스를 올리면 빠진 항목 표시. 필수값 입력은 별도 과업으로 만들지 않음.","companies(필수 6개) · company_documents.submit_method"],
  ["8","상태","진행 필요 = 아직 시작 안 함. 진행 중 = [시작]을 눌렀거나 단계를 하나라도 체크함. 헤더를 눌러 여러 값으로 거르기.","todos.status"],
  ["9","시작 / 처리","진행 필요 → [시작]: 처리 창을 열고 마감일 확정. 진행 중 → [처리]. 행 아무 곳이나 눌러도 열림.","—"],
  ["10","빈값 안내","그 과업에 필요한 기업 정보만 안내하고 [바로 입력]으로 기업 DB에 저장(변경 이력: 브이드림 내부).","companies · company_documents · change_logs"],
  ["11","마감일","기본 마감일 = 기준일 + 설정 N일. 시작할 때 최종 마감일 확정, 이후 변경은 변경 이력에 기록.","due_settings · todos.final_due · change_logs"],
  ["12","처리 영역","과업 유형별 입력. 저장 결과는 원래 메뉴의 같은 데이터에 바로 반영되고 완료 조건을 채우면 목록에서 빠짐.","유형별 원본 테이블"]]},
 exp:{t:"계약만료",items:[
  ["1","대상","재직 고용 건 중 현재 계약만료일 D-60 이내. 최종 확정 후 단계가 남은 건은 기간과 관계없이 유지.","employments + contract_terms(최신 seq)"],
  ["2","만료 D-day","D-14 이내 빨강, D-30 이내 주황. 헤더로 정렬.","contract_terms.end_date"],
  ["3","차수 · 계약시작일 · 계약만료일","세 칸으로 분리. 최종 확정으로 다음 차수가 생기면 ‘n차 생성’.","contract_terms(seq, start_date, end_date)"],
  ["4","결정 순서","① 고객사 연장 결정(연장 · 무기계약 전환 · 종료, 연장이면 기간) → ② 근로자 수락 여부(고객사가 연장 · 무기계약일 때만: 수락 / 거절 / 응답 없음) → ③ 최종 확정. 최종 = 고객사 종료 또는 근로자 거절 → 종료, 근로자 수락 → 고객사 결정대로. 응답 없음이 만료 D-7(설정)까지 이어지면 담당자에게 재알림. 확정 시 연장은 다음 차수, 무기계약은 종료일 없는 차수, 종료는 계약만료 종료 예정 + 퇴사 서류 생성.","expiry_checks.corp_decision → wish → decision"],
  ["5","진행 단계","안내 메일 송부 · 고객사 회신 · 기업 최종 전달 = 고객사 대상(일괄 체크 가능). 근로자 의사 · 쪽지, 전산반영은 행에서 개별 체크. 고객사 결정을 저장하면 고객사 회신 단계가 자동 체크.","expiry_checks.*_at"],
  ["6","일괄 처리","선택한 건이 모두 같은 기업일 때만 고객사 대상 단계 일괄 체크.","expiry_checks"],
  ["7","필터","내 담당 / 전체, 담당자, 기업명(검색 후 선택), 근로자 이름, 기간, 최종 미확정만. 헤더 정렬 · 다중 필터와 함께 쓸 수 있음.","—"]]},
 onb:{t:"신규입사자 관리",items:[
  ["1","대상","입사 준비 · 입사서류 요청, 입사서류가 남은 건, 장애 재판정 미입력(입사 90일 이내), 계약시작일 30일 이내.","employments"],
  ["2","상태","계약시작일이 지나면 입사서류 요청 → 재직 자동 전환. 입사취소 체크 시 고용 건 종료 유형 ‘입사취소’.","employments.status, end_type"],
  ["3","서류 진행","완료 단계 합계 / 전체 단계 합계(PDF 모두싸인 3단계, 원본 5단계). 헤더로 진행률 정렬.","case_documents.step"],
  ["4","신규 입사 등록","여러 행을 한 번에 입력(시트 붙여넣기 지원). 같은 사람 = 본인 연락처 + 생년월일이 모두 같을 때. 같은 사람 행은 1명으로 묶고, DB에 있으면 기존 근로자에 고용 건만 추가. 보호자 연락처는 따로 받고 판정에 쓰지 않음. 다른 근로자와 연락처만 겹치면 ‘연락처 겹침’ 경고, 같은 사람인데 이름이 다르면 저장 차단. 서류 양식이 없는 기업은 행에 ‘서류 양식 없음’ 경고, 등록 후 상세에서 양식으로 서류 생성.","workers(phone, birth_date, guardian_phone) · employments · contract_terms(1차) · case_documents"],
  ["5","플립가입 · 입사취소","체크 즉시 저장.","employments.flip_joined, cancelled"],
  ["6","장애 재판정 확인","처리결과(확인완료 / 재발급안내완료 / 거부-중증제출 / 거부 / 기타). 거부 · 거부-중증제출 · 기타는 사유 직접 입력 필수. 재판정일자는 날짜 또는 영구장애 체크. 확인서류는 복지카드 · 판정서류 복수 선택. 확인완료는 재판정일자나 영구장애 중 하나 필수.","disability_checks"],
  ["7","신규입사 진행 특이사항","간단한 메모 한 칸. 입력 칸을 벗어나면 저장되고 근로자 상세에도 표시.","employments.onboarding_note"]]},
 lea:{t:"중도퇴사",items:[
  ["1","대상","종료 유형이 중도퇴사인 고용 건, 퇴사일 최근 순.","employments.end_type"],
  ["2","퇴사 서류","완료(해당 없음 포함) / 전체.","exit_documents.status"],
  ["3","중도퇴사 등록","재직 고용 건 검색(이름 · 연락처 뒷자리 · 생년월일, 고른 뒤 기업 · 만료일 한 줄 확인) → 퇴사일, 종료 유형, 퇴사 사유, 고용보험 상실 사유, 상세, 재연계 희망. 저장 시 고용 건 종료, 사직원 · 이직확인서 요청됨 생성.","employments · exit_documents"],
  ["4","서류 상태","요청됨 / 진행 중 / 완료 / 해당 없음. 완료 시 완료일 자동.","exit_documents"]]},
 req:{t:"고객사 요청사항",items:[
  ["1","목록","V-Work 요청사항 기능과 별개인 기록장. 상태 순(접수 → 진행 중 → 완료).","client_requests"],
  ["2","구분","법정의무교육 / 건강검진 / 연말정산 / 서류 요청 / 기타. 계약 범위 밖 요청은 기타로 기록만.","client_requests.category"],
  ["3","마감일","기본 = 등록일 + 설정 N일, 등록 시 수정 가능.","client_requests.due_date"],
  ["4","상태","완료가 아니면 내 할 일 과업.","client_requests.status"],
  ["5","등록 · 메모","기업은 일부만 입력해도 목록에서 선택. 담당자 자동, 기업 담당자 메일이 없으면 빈값 안내.","client_requests · memos"]]},
 comp:{t:"기업 DB",items:[
  ["1","탭","계약중 = 서비스 계약 종료일 ≥ 오늘, 계약만료 = 지남. 재직자 유무는 고용 건에서 자동 계산.","companies.service_end_date · employments"],
  ["2","재직 · 만료 예정","재직 = 재직 고용 건 수, 만료 예정 = D-60 이내 고용 건 수.","employments · contract_terms"],
  ["3","정보 미입력","필수 n(빨강, 마우스를 올리면 항목) · 선택 n. 필수 6개는 저장 차단.","companies · company_documents"],
  ["4","기업 정보 창","행 또는 어느 화면의 기업명을 눌러도 같은 창이 위에 열림. 기본 / 담당 / 계약 · 행정 / 근무 규칙 / 연간 일정 / 기타 · 메모 / 소속 근로자 / 변경 이력.","companies · company_documents · memos · change_logs"],
  ["5","변경 근거","저장 시 요청 경로 · 요청일 필수. 바뀐 필드마다 변경 이력 1건.","change_logs.source, source_date"],
  ["6","담당 일괄 이관","관리자만. 기업을 체크해 새 담당자와 사유 입력.","companies.manager_id · change_logs"]]},
 wk:{t:"근로자 DB",items:[
  ["1","탭","사람 기준. 재직 중 고용 건이 있으면 재직자, 없으면 퇴사자(삭제 없이 보존).","workers · employments"],
  ["2","상태값","V-Work 명칭: 입사 준비 · 입사서류 요청 · 수습 · 재직 · 연장 결정 대기(고객사 연장 결정 전) · 연장 의사 확인중(고객사 결정 후 근로자 수락 확인 중) · 고객사 결정 완료 · 퇴사 의사 접수 / 종료: 중도퇴사 · 입사취소 · 계약만료.","employments.status + expiry_checks로 계산"],
  ["3","같은 사람 기준","본인 연락처 + 생년월일. 보호자 연락처는 따로 저장하고 판정에 쓰지 않음.","workers.phone, birth_date, guardian_phone"],
  ["4","특이요청사항","소속 기업 특이요청사항을 상세 창 맨 위에 고정.","companies.special_note"],
  ["5","고용 건 · 계약 차수","기업별 고용 건마다 차수 / 구분 / 계약시작일 / 계약만료일 표.","employments · contract_terms"],
  ["6","장애 재판정 · 서류","현재 고용 건의 재판정 확인을 여기서도 수정. 입사 · 퇴사 서류와 진행 특이사항 표시.","disability_checks · case_documents · exit_documents"],
  ["7","인적 정보 수정","요청 경로 · 요청일 필수, 변경 이력.","workers · change_logs"],
  ["8","재연계 희망","퇴사자 탭 필터.","employments.rehire_wish, rehire_note"]]},
 staffv:{t:"담당자 현황 (관리자)",items:[["1","담당자 현황","담당 기업 수, 재직 근로자 수, 진행 필요 · 진행 중 · 기한 경과(대무 포함), 현재 부재.","companies · employments · todos · staff_absences"]]},
 acct:{t:"계정 관리 (관리자)",items:[
  ["1","계정 목록","상태 = 활성 / 비밀번호 변경 필요 / 비활성.","auth.users + staff"],
  ["2","아이디 생성","이름 · 아이디(회사 메일) · 파트 · 권한 → 임시 비밀번호 자동 생성, 한 번만 표시. 첫 로그인 시 비밀번호 변경 강제.","Edge Function admin-users(create)"],
  ["3","비밀번호 초기화 · 비활성화","초기화는 두 번 눌러 확정. 비활성화 시 로그인 차단, 담당 기업이 남아 있으면 이관 먼저.","Edge Function admin-users(reset, set_active)"],
  ["4","권한","담당자 / 관리자. 본인 계정은 바꿀 수 없음.","staff.role"],
  ["5","보안","service_role 키는 Edge Function에만. 호출 때 관리자 여부를 서버에서 다시 확인.","change_logs"]]},
 dis:{t:"장애 재판정 (근로자 관리)",items:[
  ["1","탭","재판정 임박(60일 이내) / 재판정일 지남 / 미입력 / 전체 재직자. 메뉴 옆 숫자 = 임박 + 지남.","disability_checks · employments"],
  ["2","처리결과","확인완료 / 재발급안내완료 / 거부-중증제출 / 거부 / 기타. 거부 계열은 빨강.","disability_checks.result, reason"],
  ["3","재판정일자","영구장애는 재판정 없음. 60일 이내면 내 할 일 ‘재판정 안내’ 과업 생성(마감 = 재판정일 -30일, 설정에서 변경).","disability_checks.recheck_date, permanent · due_settings(rech)"]]},
 set:{t:"설정 (관리자)",items:[["1","기본 마감일","과업 유형별 기준일 + N일. 확정된 최종 마감일은 그대로.","due_settings"]]},

var COMMON=[
  ["A","이름 연결","기업명 → 기업 정보 창, 근로자 이름 → 근로자 정보 창이 현재 화면 위에 열림. 닫으면 보던 화면 그대로.","—"],
  ["B","부재 등록","본인(관리자는 다른 담당자도). 오전반차 09:00~14:00, 오후반차 13:00~18:00 자동 입력. 부재 시간 동안 담당 기업 과업이 기본 대무자에게 ‘대무’로 표시.","staff_absences"],
  ["C","엑셀 다운로드","현재 목록을 필터 · 정렬 그대로 전체 페이지 내려받기.","—"],

/* ---- Supabase Storage 업로드 (실제 연결 시). 예시 화면에서는 파일 이름만 씁니다 ---- */
function upFiles(prefix,files){
  files=[].slice.call(files||[]);
  if(!LIVE)return Promise.resolve(files.map(function(f){return{path:"demo/"+prefix+"/"+f.name,name:f.name,size:f.size}}));
  var stamp0=Date.now();
  return files.reduce(function(p,f,i){return p.then(function(out){var ext=(f.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").slice(0,8),path=prefix+"/"+stamp0+"_"+i+"."+ext;
    return sb.storage.from(STORAGE_BUCKET).upload(path,f,{upsert:true,contentType:f.type||"application/octet-stream"}).then(function(r){if(r.error)throw r.error;out.push({path:path,name:f.name,size:f.size});return out})})},Promise.resolve([]));
}

function intakeChange(t,d,isInput){
  if(d.ir&&S.inForm){var q=d.ir.split(":"),r=S.inForm.rows[+q[0]];if(r){r[q[1]]=t.value;if(S.inForm.err[q[0]]){var e=S.inForm.err[q[0]],k=e.indexOf(q[1]);if(k>=0){e.splice(k,1);t.classList.remove("err")}}}return true}
  if(d.ifd&&S.inForm){S.inForm.def[d.ifd]=t.value;return true}
  if(d.rr&&S.inRr){S.inRr[d.rr]=t.value;return true}
  if(d.gr&&S.grpRows){var g=d.gr.split(":"),gr=S.grpRows[+g[0]];if(gr)gr[g[1]]=t.value;return true}
  if(d.gn&&S.grpNew){S.grpNew[d.gn]=t.value;return true}
  if(d.dt&&S.dtpl){var p=d.dt.split(":");S.dtpl[p[0]][+p[1]][p[2]]=t.value;return true}
  if(d.tf&&S.tplF){S.tplF[d.tf]=t.value;S.tplF.dirty=true;S.tplF.armClose=false;return true}
  if(d.tplbody&&S.tplF){S.tplF.body=t.innerHTML;S.tplF.dirty=true;S.tplF.armClose=false;return true}
  if(isInput)return false;
  if(d.ch==="in-pick"){S.inSel[d.id]=t.checked;render();return true}
  if(d.ch==="t-all"){selAllSet(d.t,t.checked);render();return true}
  if(t.hasAttribute&&t.hasAttribute("data-rrdoc")&&S.inRr){var L=S.inRr.docs,i=L.indexOf(t.value);if(t.checked&&i<0)L.push(t.value);if(!t.checked&&i>=0)L.splice(i,1);return true}
  if(d.ch==="du-files"){var dl=$("#du-list");if(dl)dl.innerHTML=fileListHtml(t.files);return true}
  if(d.ch==="cu-file"){var nm=$("#cu-n"+d.n);if(nm)nm.textContent=t.files&&t.files[0]?t.files[0].name:"";return true}
  if(d.ch==="gr-file"&&S.grpRows){S.grpRows[+d.i].file=t.files&&t.files[0]||null;var nx=t.nextElementSibling;if(nx){nx.textContent=S.grpRows[+d.i].file?"올릴 파일: "+S.grpRows[+d.i].file.name:"파일 없음";nx.style.color="var(--p)"}return true}
  if(d.ch==="in-restore-folder"&&S.inComp){S.inComp.folder=t.checked;return true}
  if(d.ch==="inc-miss"){S.incMiss=t.checked;tst("incomp").page=1;render();return true}
  if(d.ch==="tpl-html"&&S.tplF){tplSync();S.tplF.body=cleanHtml(S.tplF.body);S.tplF.html=t.checked;render();return true}
  return false;
}

/* ---- 파일 읽기 ---- */
function migRead(file,kind){
  if(!file)return;
  if(!/\.xlsx$/i.test(file.name)){toast("엑셀(.xlsx) 파일만 올릴 수 있습니다");return}
  toast("파일을 읽는 중…");
  xlLoad().then(function(X){return file.arrayBuffer().then(function(buf){var wb=new X.Workbook();return wb.xlsx.load(buf).then(function(){return wb})})})
  .then(function(wb){
    var M={kind:kind,file:file.name,sets:{},tab:"main",f:"issue",lim:200,map:{},auto:{}};
    var err=kind==="comp"?migParseC(wb,M):kind==="wk"?migParseW(wb,M):migParseIn(wb,M);
    if(err){toast(err);return}
    S.mig=M;if(kind==="in"){migAutoMap();M.tab="map"}
    migValidate();
    var c=migCount(migAll());
    toast(migAll().length+"행을 읽었습니다 · 오류 "+c.err+" · 반려 "+c.rej+" · 경고 "+c.warn+(M.skipped?" · ‘"+M.skipped+"’ 시트는 읽지 않음(퇴사자 제외)":""));render();
    setTimeout(function(){var p=$("#mig-p");if(p&&p.scrollIntoView)p.scrollIntoView({block:"start"})},50);
  }).catch(function(e){console.error(e);toast("파일을 읽지 못했습니다: "+(e&&e.message||e))});
}
function wsCell(ws,r,c){return ws.getRow(r).getCell(c).value}

function migParseC(wb,M){
  var ws=null,hr=0;
  wb.worksheets.forEach(function(w){if(ws)return;for(var r=1;r<=6;r++){if(hNorm(wsCell(w,r,3))==="기업명"&&hNorm(wsCell(w,r,4))==="브이워크기업명"){ws=w;hr=r;return}}});
  if(!ws)return"기업 양식이 아닙니다. [양식 다운로드]로 받은 파일(C열 기업명 · D열 브이워크 기업명)에 넣어 올려 주세요";
  if(hNorm(wsCell(ws,hr,1))!=="기업코드")return"A열이 ‘기업코드’가 아닙니다(기존 시트는 A열이 NO). 양식의 A열에 기업코드를 넣고 B열부터 기존 내용을 붙여 넣어 주세요";
  var bad=[[8,"담당자(브이드림)"],[12,"변경후담당자"],[14,"임대계약종료일"],[34,"수취방법"],[46,"규정"],[68,"수취방법"]].filter(function(x){return hNorm(wsCell(ws,hr,x[0])).indexOf(x[1].replace(/[()]/g,""))<0&&hNorm(wsCell(ws,hr,x[0]))!==x[1]});
  if(bad.length)return"칸 순서가 양식과 다릅니다("+bad.map(function(x){return x[1]}).join(", ")+" 위치). 양식을 다시 받아 붙여 넣어 주세요";
  var rows=[];
  for(var r=hr+1;r<=ws.rowCount;r++){
    var d={},any=false,z=0;MIG_C.forEach(function(f){if(!f[1])return;var v=wsCell(ws,r,f[0]);if(mZero(v)&&MIG_KEEP0.indexOf(f[1])<0){v="";z++}d[f[1]]=f[3]==="date"?v:mt(v);if(mt(v))any=true});
    if(!any||(!d.corp_code&&!d.name&&!d.display_name))continue;
    M.zero=(M.zero||0)+z;
    rows.push({n:r,sh:ws.name,d:d,iss:[],st:"ok"});
  }
  if(!rows.length)return"등록할 행이 없습니다. "+(hr+1)+"행부터 내용을 넣어 주세요";

function migParseW(wb,M){
  var rows=[],found=0;

    if(ws.state==="hidden"||ws.name==="작성 안내")return;if(/퇴사/.test(ws.name)){M.skipped=ws.name;return}
    var hr=0,map={};
    for(var r=1;r<=10&&!hr;r++){var row=ws.getRow(r),m={};row.eachCell(function(cell,c){m[hNorm(cell.value)]=c});if((m["성명"]||m["이름"])&&m["기업코드"]){hr=r;map=m}}

    for(var r2=hr+1;r2<=ws.rowCount;r2++){
      var d={},c,z=0;F.forEach(function(f){if(f[2]==="skip")return;c=col(f);var v=c?wsCell(ws,r2,c):"";if(mZero(v)){v="";z++}d[f[0]]=f[2]==="date"?v:mt(v)});
      if(!d.name&&!mt(d.code))continue;
      M.zero=(M.zero||0)+z;
      rows.push({n:r2,sh:ws.name,d:d,retired:retired,iss:[],st:"ok"});
    }
  });
  if(!found)return"근로자 양식이 아닙니다. ‘성명’ · ‘기업코드’ 머리글이 있는 시트(재직자 · 퇴사자)가 필요합니다";

function migParseIn(wb,M){

    for(var r=2;r<=ws.rowCount;r++){var d={},any=false;cfg.cols.forEach(function(f){var c=map[hNorm(f[1])];var v=c?wsCell(ws,r,c):"";d[f[0]]=(k==="app"&&["birth","flip","cs","ce"].indexOf(f[0])>=0)?v:mt(v);if(mt(v))any=true});if(any)M.sets[k].push({n:r,sh:cfg.sh,d:d,iss:[],st:"ok"})}
  });
  if(!n)return"Firebase 내보내기 파일이 아닙니다(기업발송정보 · 메일템플릿 시트가 없음). 내보내기 HTML로 받은 파일을 올려 주세요";
}

    /* 현재 담당자 = L열(변경후담당자). H~K열(담당자 · 변경1 · 변경2 · 변경전담당자)은 과거 이력 */

    x.chain=chain;x.mgrName=mNone(mt(d.m4))?"":mt(d.m4);x.prevName=chain.filter(function(v){return v!==x.mgrName}).pop()||"";
    if(d._mgr)x.mgr=d._mgr;else{var s=staffByName(x.mgrName);if(s)x.mgr=s.id}

    else if(!x.end)I.push(mi("service_end","err","임대계약 종료일 형식이 이상해요(‘"+ev+"’) · 수정이 필요해요","date"));
    MIG_C.forEach(function(f){

      }else if(f[3]==="tel"&&!mTelOk(v))I.push(mi(k,"err",lab+" 형식이 이상해요(‘"+v+"’) · 수정이 필요해요","text"));
      else if(f[3]==="email"&&!mMailOk(v))I.push(mi(k,"err",lab+" 형식이 이상해요(‘"+v+"’) · 수정이 필요해요","text"));
    });

}
function migVW(){

    case"mig-close":S.mig=null;render();return true;

    case"mig-f":S.mig.f=el.dataset.v;S.mig.lim=200;render();return true;
    case"mig-more":S.mig.lim+=200;render();return true;
    case"mig-reg":(function(){var c=migCount(migAll());askConfirm("등록할까요?",(c.ok+c.warn)+"건을 등록합니다"+(c.rej?" · 반려 "+c.rej+"건은 빠집니다":"")+". 등록한 뒤에는 각 화면에서 고치거나 지워야 합니다.","등록",migRegister)})();return true;
    case"pw-show":(function(){var c=comp(el.dataset.id);if(!c||!canPw(c))return;S.pwOpen=c.id;var s=secOf(c.id);if(s&&s.pw)logChange("companies",c.id,c.name,"플립계정 PW 열람","","","브이드림 내부");render()})();return true;
  }
  return false;
}
function migChange(t,d){
  if(d.ch==="mig-file"){var f=t.files&&t.files[0];migRead(f,d.k);t.value="";return true}
  if(d.ch==="mig-unmapped"){S.mig.onlyUn=t.checked;render();return true}
  if(d.migMap!==undefined){S.mig.map[d.migMap]=t.value;S.mig.auto[d.migMap]=0;migValidate();render();return true}
  if(d.mig){var p=d.mig.split("|"),r=(S.mig.sets[p[0]]||[])[+p[1]];if(!r)return true;r.d[p[2]]=t.value;migValidate();render();return true}
  return false;
}

 {id:"work_miss",kind:"work",wt:"미작성",lv:1,mode:"",name:"업무일지_미작성 안내 (신규)",title:"[안내] 업무일지 미작성 확인 및 작성 요청",body:"{근로자}님, 안녕하세요.\n최근 업무일지 점검 결과, {문제일자}자 업무일지가 작성되지 않은 것으로 확인되어 안내드립니다.\n\n업무일지는 당일의 구체적인 업무 수행 내용을 기록하고 증빙하는 중요한 공적 서류이며, 급여 지급의 근거가 됩니다.\n아래 기한 내에 작성되지 않은 업무일지를 작성해 주시기 바랍니다.\n\n1. 작성 대상 : {문제일자} 업무일지\n2. 완료 기한 : {완료기한}까지\n\n반드시 시스템 내에서 해당 날짜로 달력을 변경하신 후 작성해 주세요.\n"+NT_GUIDE+"\n감사합니다."},

 {id:"work_2d",kind:"work",lv:2,mode:"기한",name:"업무일지_경고 (기한 수정형)",title:"[경고] 업무일지 증빙 자료 부정 제출에 따른 전수 수정 요청",body:"{근로자}님, 안녕하세요.\n최근 제출하신 업무일지 점검 결과, {문제일자}자 증빙 자료에서 {위반내용} 사실이 반복적으로 확인되어 엄중히 경고합니다.\n\n업무일지는 급여 지급 및 업무 성과 측정의 근거가 되는 공적 서류입니다.\n장기간 {위반내용}하는 행위는 실제 업무 수행 여부를 속이는 '허위 보고'이자 '업무 기만'에 해당하며, 이는 향후 인사 평가 및 계약 유지에 있어 중대한 결격 사유가 됩니다.\n이에 아래와 같이 즉각적인 시정을 요구합니다.\n\n1. 수정 대상 : {문제일자} 업무일지 전체\n2. 요구 사항 : {자료유형}로 전수 재작성 및 교체\n3. 완료 기한 : {완료기한}까지\n\n기한 내 수정 미완료 시 사규에 따른 공식 조치가 취해질 수 있음을 알려드립니다.\n본인의 업무 성실도를 실질적으로 증명할 수 있도록 정직하고 성실한 작성에 임해주시기 바랍니다."},
 {id:"work_3f",kind:"work",lv:3,mode:"향후",name:"업무일지_엄중경고 (향후 유의형)",title:"[엄중 경고] 업무일지 허위 보고 및 증빙 부정 사용에 따른 시정 지시",body:"{근로자}님, 안녕하세요.\n앞서 안내드린 {문제일자}자 업무일지 시정 요청에도 불구하고, 이후 {문제일자2}에도 개선 요청에 대한 지시를 이행하지 않은 점이 확인되었습니다.\n\n"+NT_SEV+"\n\n - 지시 사항 : 금일 이후 모든 업무일지에는 {자료유형}을 반드시 첨부할 것\n본 안내 이후 단 한 건이라도 증빙이 누락되거나 부적절한 자료가 적발될 경우, 해당 건은 '반복적 지시 미이행'으로 분류되어 공식 보고 및 징계 절차가 진행될 수 있습니다.\n본인의 성실도를 증명할 마지막 기회임을 유념하시기 바랍니다."},

  if(ty==="bool")return!!v;
  if(ty==="yn")return v==="필요";
  if(ty==="int")return(v===""||v==null||isNaN(+v))?null:+v;
  if(ty==="json")return Array.isArray(v)?v:[];
  if(ty==="any")return v==null?{}:v;
  if(ty==="obj")return(v&&typeof v==="object")?v:{};
  if(ty==="ts")return v?new Date(v).toISOString():null;
  if(ty==="tsm"||ty==="tss")return v?new Date(String(v).replace(" ","T")).toISOString():null;
  return(v===""||v==null)?null:v;
}
function fromVal(ty,v){
  if(ty==="bool")return!!v;
  if(ty==="yn")return v?"필요":"불필요";
  if(ty==="int")return v==null?null:Number(v);
  if(ty==="json")return Array.isArray(v)?v:[];
  if(ty==="any")return v==null?{}:v;
  if(ty==="obj")return(v&&typeof v==="object")?v:{};
  if(ty==="ts")return locTs(v,"T");
  if(ty==="tsm")return locTs(v," ");
  if(ty==="tss"){var d=v&&new Date(v);return d&&!isNaN(d)?locTs(v," ")+":"+pad(d.getSeconds()):""}
  if(ty==="date")return v?String(v).slice(0,10):"";
  return v==null?"":v;
}
function toRow(d,o){var r={};d.cols.forEach(function(c){r[colName(c)]=toVal(c[2],getP(o,c[0]))});return r}
function fromRow(d,r){var o={};d.cols.forEach(function(c){setP(o,c[0],fromVal(c[2],r[colName(c)]))});return o}
function staffFrom(r){return{page_size:r.page_size||null,id:r.id,name:r.name||"",email:r.email||"",part:r.part||"",role:r.role||"담당자",active:r.active!==false,must:!!r.must_change_pw,last:locTs(r.last_login_at," ")}}
function metaRows(){return Object.keys(DB.meta).map(function(k){var m=DB.meta[k]||{},i=k.indexOf(":");return{todo_key:k,todo_type:k.slice(0,i),ref_id:k.slice(i+1),status:m.status||null,final_due:m.final||null,started_on:m.started||null}})}

function fetchAll(t){
  var out=[];
  function page(f){return sb.from(t).select("*").range(f,f+999).then(function(r){if(r.error)throw r.error;out=out.concat(r.data||[]);if((r.data||[]).length===1000)return page(f+1000)})}
  return page(0).then(function(){return out});
}
function snapAll(){
  SNAP={};
  TB.forEach(function(d){var m={},pk=colName(d.cols[0]);DB[d.k].forEach(function(o){var r=toRow(d,o);m[r[pk]]=JSON.stringify(r)});SNAP[d.k]=m});
  var mm={};metaRows().forEach(function(r){mm[r.todo_key]=JSON.stringify(r)});SNAP.meta=mm;
  lastLoad=Date.now();
}
function loadAll(){
  var names=["staff"].concat(TB.map(function(d){return d.t}),["todos"]);
  return Promise.all(names.map(fetchAll)).then(function(res){
    DB.staff=res[0].map(staffFrom);
    TB.forEach(function(d,i){DB[d.k]=res[i+1].map(function(r){return fromRow(d,r)})});
    DB.meta={};res[res.length-1].forEach(function(r){DB.meta[r.todo_key]={status:r.status||"",final:r.final_due?String(r.final_due).slice(0,10):"",started:r.started_on?String(r.started_on).slice(0,10):""}});
    DB.logs.sort(function(a,b){return b.at.localeCompare(a.at)});
    DB.memos.sort(function(a,b){return a.at.localeCompare(b.at)});
    if(!DB.settings.length)DB.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    mergeSplit();snapAll();
  });
}
function reloadStaff(){return fetchAll("staff").then(function(rows){DB.staff=rows.map(staffFrom)})}
function setSaving(t){SAVEST=t;var el=document.getElementById("savest");if(el)el.textContent=t}
function schedulePersist(){if(!LIVE||!READY)return;pending=true;clearTimeout(pT);pT=setTimeout(persist,300)}
function persist(){
  pending=false;
  if(persisting){dirty=true;return}
  var steps=[],next={};
  TB.forEach(function(d){
    if(d.ro){next[d.k]=SNAP[d.k]||{};return}
    var pk=colName(d.cols[0]),old=SNAP[d.k]||{},cur={},ins=[],upd=[],dels=[];
    DB[d.k].forEach(function(o){var r=toRow(d,o),id=r[pk];if(id==null)return;var j=JSON.stringify(r);cur[id]=j;
      if(old[id]===undefined){ins.push(r);return}
      if(old[id]===j||d.ins)return;
      /* 바뀐 칸만 보냄 → Apps Script 가 같은 행의 다른 칸(발송 결과 등)을 써도 덮어쓰지 않음 */
      var o0=JSON.parse(old[id]),diff={};Object.keys(r).forEach(function(k){if(JSON.stringify(r[k])!==JSON.stringify(o0[k]))diff[k]=r[k]});upd.push([id,diff])});
    if(d.del)Object.keys(old).forEach(function(id){if(!(id in cur))dels.push(id)});
    for(var ci=0;ci<ins.length;ci+=500)(function(chunk){steps.push(function(){return d.ins?sb.from(d.t).insert(chunk):sb.from(d.t).upsert(chunk,{onConflict:pk})})})(ins.slice(ci,ci+500));
    if(upd.length)steps.push(function(){return Promise.all(upd.map(function(u){return sb.from(d.t).update(u[1]).eq(pk,u[0])})).then(function(rs){return rs.find(function(x){return x&&x.error})||{}})});
    if(dels.length)steps.push(function(){return sb.from(d.t).delete().in(pk,dels)});
    next[d.k]=cur;
  });
  var mc={},mu=[];metaRows().forEach(function(r){var j=JSON.stringify(r);mc[r.todo_key]=j;if((SNAP.meta||{})[r.todo_key]!==j)mu.push(r)});next.meta=mc;
  if(mu.length)steps.push(function(){return sb.from("todos").upsert(mu,{onConflict:"todo_key"})});
  if(!steps.length)return;
  persisting=true;setSaving("저장 중…");
  steps.reduce(function(p,f){return p.then(function(){return f().then(function(r){if(r&&r.error)throw r.error})})},Promise.resolve())
  .then(function(){SNAP=next;setSaving("저장됨")})
  .catch(function(e){console.error(e);setSaving("저장 실패");toast("저장하지 못했습니다: "+(e&&e.message||e)+" · 서버 데이터를 다시 불러옵니다");return loadAll().then(render)})
  .then(function(){persisting=false;if(dirty){dirty=false;persist()}});
}
/* 다른 담당자가 바꾼 내용: 탭으로 돌아오거나 3분마다 다시 읽음(입력 중이거나 저장 대기 중이면 건너뜀) */
function maybeReload(force){
  if(!LIVE||!READY||persisting||pending)return;
  if(!force&&Date.now()-lastLoad<60000)return;
  var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if($("#modal").innerHTML)return;
  loadAll().then(function(){autoLinkMine();render()}).catch(function(e){console.warn(e)});
}
/* 입구서 발송: 작업기가 처리한 결과(발송 · 수신 · 파일)를 자주 다시 읽음 */
var POLL_T=["intake_applicants","intake_rerequests","gas_jobs","mail_logs","email_uploads","gas_heartbeat"];
function pollIntake(){
  if(!LIVE||!READY||persisting||pending)return;
  var ds=TB.filter(function(d){return POLL_T.indexOf(d.t)>=0});
  Promise.all(ds.map(function(d){return fetchAll(d.t)})).then(function(res){
    if(persisting||pending)return;
    ds.forEach(function(d,i){DB[d.k]=res[i].map(function(r){return fromRow(d,r)});var m={},pk=colName(d.cols[0]);DB[d.k].forEach(function(o){var r=toRow(d,o);m[r[pk]]=JSON.stringify(r)});SNAP[d.k]=m});
    autoLinkMine();
    var a=document.activeElement;if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;if($("#modal").innerHTML)return;render();
  }).catch(function(e){console.warn(e)});
}
setInterval(function(){if(!document.hidden&&(S.view==="intake"||pendingJobs().length))pollIntake()},20000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)maybeReload(false)});
setInterval(function(){if(!document.hidden)maybeReload(true)},180000);

/* ---------- 로그인 · 내 정보 ---------- */
function showGate(msg){
  var g=$("#gate");g.hidden=false;
  g.innerHTML='<form class="dlg" data-form="login" style="padding:26px;width:min(400px,100%)"><div style="color:var(--p);font-weight:700">V-Work</div><h2 style="margin:2px 0 6px;font-size:19px">임시 DB 관리</h2><p class="hint" style="margin-bottom:14px">회사 메일과 비밀번호로 로그인하세요.</p>'+
    '<div class="fg"><label class="f full"><span>아이디 (회사 메일)</span><input id="lg-email" type="email" autocomplete="username" required></label><label class="f full"><span>비밀번호</span><input id="lg-pw" type="password" autocomplete="current-password" required></label></div>'+
    '<div class="err" id="lg-err" role="alert">'+esc(msg||"")+'</div><button class="btn pri" id="lg-btn" style="width:100%;margin-top:8px" type="submit">로그인</button><p class="hint" style="margin-top:10px">비밀번호를 잊었다면 관리자에게 초기화를 요청하세요.</p></form>';
  var e=$("#lg-email");if(e)e.focus();
}
function afterLogin(session){
  var g=$("#gate");g.hidden=false;g.innerHTML='<div class="dlg" style="padding:26px">불러오는 중…</div>';
  loadAll().then(function(){
    var me=DB.staff.find(function(x){return x.id===session.user.id});
    if(!me||!me.active){sb.auth.signOut();showGate(me?"비활성화된 계정입니다. 관리자에게 문의하세요.":"담당자 정보가 등록되지 않은 계정입니다. 관리자에게 문의하세요.");return}
    S.me=me.id;S.role=isAdminRole(me.role)?"admin":"staff";S.scope=S.role==="admin"?"all":"mine";
    READY=true;g.hidden=true;g.innerHTML="";loadPrefs();autoLinkMine();
    sb.rpc("vw_touch_login").then(function(){},function(){});
    render();
    if(me.must)myInfo(true);
  }).catch(function(e){console.error(e);showGate("데이터를 불러오지 못했습니다: "+(e.message||e)+" (schema.sql 실행 여부를 확인해 주세요)")});
}
function myInfo(force){
  var me=st(S.me);S.forcePw=!!force;
  $("#modal").innerHTML='<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="내 정보"><div class="ph"><div><div class="k">내 정보</div><h2>'+(force?"비밀번호를 바꿔 주세요":"이름 · 비밀번호")+'</h2></div>'+(force?"":'<button class="close" data-act="modal-close" aria-label="닫기">×</button>')+'</div>'+
    '<div class="ps"><div class="fg"><label class="f full"><span>이름 (변경 이력에 표시)</span><input id="mi-name" value="'+esc(me.name)+'" maxlength="20"></label>'+
    '<label class="f"><span>새 비밀번호</span><input id="mi-pw1" type="password" autocomplete="new-password" placeholder="8자 이상"></label><label class="f"><span>새 비밀번호 확인</span><input id="mi-pw2" type="password" autocomplete="new-password"></label></div>'+
    '<p class="hint" style="margin-top:8px">'+(force?"관리자가 발급한 임시 비밀번호로 로그인했습니다. 본인만 아는 비밀번호로 바꿔야 계속 사용할 수 있습니다.":"비밀번호를 바꾸지 않으려면 비워 두세요.")+'</p><div class="err" id="mi-err" role="alert"></div></div>'+
    '<div class="ps foot">'+(force?'<button class="btn" data-act="logout">로그아웃</button>':'<button class="btn" data-act="modal-close">취소</button>')+'<button class="btn pri" data-act="mi-save">저장</button></div></div></div>';
  var f=force?$("#mi-pw1"):$("#mi-name");if(f)f.focus();
}
function miSave(btn){
  var me=st(S.me),nm=$("#mi-name").value.trim(),p1=$("#mi-pw1").value,p2=$("#mi-pw2").value,er=$("#mi-err");er.textContent="";
  if(!nm){er.textContent="이름을 입력해 주세요.";return}
  if(S.forcePw&&!p1){er.textContent="새 비밀번호를 입력해 주세요.";return}
  if(p1&&p1.length<8){er.textContent="비밀번호는 8자 이상으로 입력해 주세요.";return}
  if(p1!==p2){er.textContent="새 비밀번호와 확인 값이 다릅니다.";return}
  btn.disabled=true;
  var chain=Promise.resolve();
  if(p1)chain=chain.then(function(){return sb.auth.updateUser({password:p1})}).then(function(r){if(r.error)throw r.error;return sb.rpc("vw_clear_must_change")}).then(function(r){if(r&&r.error)throw r.error});
  if(nm!==me.name)chain=chain.then(function(){return sb.rpc("vw_update_my_name",{p_name:nm})}).then(function(r){if(r&&r.error)throw r.error});
  chain.then(function(){me.name=nm;if(p1)me.must=false;S.forcePw=false;$("#modal").innerHTML="";toast(p1?"이름과 비밀번호를 저장했습니다":"저장했습니다");render()})
  .catch(function(e){btn.disabled=false;er.textContent="저장하지 못했습니다. "+(/different|same/i.test(e.message||"")?"이전과 다른 비밀번호를 입력해 주세요.":(e.message||""))});
}
/* 관리자 전용 Edge Function 호출 (service_role 키는 서버에만 있음) */
function callAdmin(body){
  return sb.functions.invoke(CONFIG.edgeFunction,{body:body}).then(function(r){
    if(r.error){var c=r.error.context;if(c&&typeof c.json==="function")return c.json().then(function(b){throw new Error(b&&b.error||r.error.message)},function(){throw r.error});throw r.error}
    if(r.data&&r.data.error)throw new Error(r.data.error);
    return r.data;
  });
}
document.addEventListener("submit",function(ev){
  var f=ev.target.dataset&&ev.target.dataset.form;if(f!=="login")return;ev.preventDefault();
  var b=$("#lg-btn");b.disabled=true;$("#lg-err").textContent="";
  sb.auth.signInWithPassword({email:$("#lg-email").value.trim(),password:$("#lg-pw").value}).then(function(r){
    b.disabled=false;
    if(r.error){$("#lg-err").textContent="로그인하지 못했습니다. 아이디와 비밀번호를 확인해 주세요.";return}
    afterLogin(r.data.session);
  });
});

/* ---------- 시작 ---------- */
if(!LIVE){loadPrefs();render()}
else if(!window.supabase){showGate("Supabase 라이브러리를 불러오지 못했습니다. 네트워크를 확인해 주세요.")}
else{
  sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)afterLogin(r.data.session);else showGate()});
}
})();
</script>
