<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영페이지 도움말</title>
<style>
:root{--ink:#1F1D2B;--ink-2:#6B6880;--line:#E6E3EF;--bg:#F7F6FB;--acc:#5B4BC4;--acc-2:#EEEBFF;--ok:#2E9E5B;--ok-bg:#EEF8F1;--off:#8A8A95;--off-bg:#F3F3F5;--bad:#E5484D}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;margin:0}
.top .sub{color:var(--ink-2);font-size:12.5px}
.top input{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;max-width:1400px;margin:0 auto}
nav{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:14px 10px;border-right:1px solid var(--line);background:#fff}
nav h4{font-size:11.5px;color:var(--ink-2);margin:14px 8px 4px;font-weight:600}
nav a{display:block;padding:5px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
nav a.on{background:var(--acc-2);color:var(--acc);font-weight:600}
nav a:hover{background:var(--bg)}
main{padding:20px 28px 80px;min-width:0}
section{display:none;max-width:1100px}
section.on{display:block}
h2{font-size:21px;margin:4px 0 4px}
.lead{color:var(--ink-2);margin:0 0 14px}
.who{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.who span{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 16px}
.chips b{font-size:12.5px;color:var(--ink-2);margin-right:4px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font:inherit;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bnote{background:var(--acc-2);border-radius:8px;padding:8px 12px;margin:-6px 0 14px;font-size:13.5px}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.step h3{margin:0 0 6px;font-size:15.5px;display:flex;gap:8px;align-items:center}
.step h3 i{font-style:normal;display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:12.5px}
.step p{margin:0 0 8px}
.step .tip{font-size:12.5px;color:var(--ink-2)}
.step img{display:block;max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:zoom-in}
.step.hide{display:none}
.kbd{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 6px;font-size:12.5px}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-size:13.5px}
th{background:var(--bg);font-size:12.5px;color:var(--ink-2)}
td.c,th.c{text-align:center}
.chk{color:var(--ink-2)}
.need{color:#B45309;font-size:12px}
.sw{display:inline-block;width:18px;height:12px;border-radius:2px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
.menus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.menus .m{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.menus .m b{display:block}
.menus .m span{color:var(--ink-2);font-size:13px}
.zoom{position:fixed;inset:0;background:rgba(20,18,30,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.foot{color:var(--ink-2);font-size:12px;margin-top:30px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}nav h4{width:100%;margin:6px 4px 0}main{padding:16px}.top input{min-width:0;width:40%}}
</style>
</head>
<body>
<div class="top"><h1>운영페이지 도움말</h1><span class="sub">메뉴마다 어떻게 진행되는지 · 화면은 예시 데이터</span><input id="q" placeholder="찾기 (예: 연장, 조율, 원본)" aria-label="찾기"></div>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
(function(){
"use strict";
var IMG="img/";
/* ---------- 흐름 가이드 ---------- */
var FLOWS=[
{id:"rreq",title:"채용 요청",lead:"고객사 채용 요청을 받아 후보를 찾고, 운영파트가 고객사에 전달하고, 합격자가 입사할 때까지예요.",
 who:["채용파트 · 후보 찾기 · 결과 입력","운영파트 · 고객사 전달 · 완료 확인","영업 · 사전 공유","발굴파트 · 인재 추천"],
 branch:{label:"채용 구분",opts:["신규","추가","대체"],note:{"신규":"새 고객사 채용이에요. 영업 홈 사전 공유에서 ‘계약완료’를 누르면 채용 요청이 자동으로 만들어져요. 같은 기업에 진행 중인 채용 요청이 있으면 ‘기존 건에 연결 / 새로 만들기’를 먼저 물어요.","추가":"이미 근무 중인 고객사의 인원 추가예요. 등록할 때 기업 DB에서 기업을 골라요.","대체":"그만두는 근로자의 자리를 채우는 채용이에요. 대체 대상(근로자)을 꼭 골라요. 계약만료에서 ‘종료’로 결정된 건은 [대체 채용 요청]으로 만들면 대상이 채워져요."}},
 steps:[
  {t:"채용 요청 등록",p:"채용 요청 › <span class='kbd'>+ 채용 요청</span>에서 기업 · 구분 · 직무 · 근무 조건 · 마감을 넣어요. 하루 4시간 이상이면 휴게 30분이 자동으로 들어가요(8시간이면 1시간).",tip:"기업 DB에 없는 기업은 ‘미등록 기업’으로 이름만 넣고, 나중에 요청 창의 [기업 DB에 등록하고 연결]로 이어요.",img:"rr-1-form"},
  {t:"후보 넣기",p:"요청 창 › 후보 · 차수 탭의 차수 카드에서 <span class='kbd'>+ 후보자</span>(직접) · <span class='kbd'>+ 계약만료자에서</span> · <span class='kbd'>+ 인재에서</span>로 넣어요.",tip:"연락처와 이름이 근로자 DB · 인재 풀 · 포트폴리오와 같으면 자동으로 연결돼요. 연락처만 같고 이름이 다르면 ‘연락처 같음 · 이름 다름’으로만 보여요.",img:"rr-2-cand"},
  {t:"발굴파트 추천 확인",p:"발굴파트가 추천한 인재는 ‘발굴파트 추천’에 검토 대기로 와요. <span class='kbd'>후보로 추가</span>하면 채용 요청 직무와 연락처로 최근 차수에 들어가요.",tip:"처리한 추천은 아래 ‘처리 완료’로 접혀요(최근 30일).",img:"rr-3-orec"},
  {t:"운영파트에 이력서 전달",p:"후보를 다 넣으면 <span class='kbd'>운영파트에게 이력서 전달</span>을 눌러요. 그 전에는 ‘운영 전달 전’으로 보이고 운영파트 할 일에 올라가지 않아요.",tip:"운영파트가 고객사에 보내면 ‘이력서 전달’ 날짜가 채워져요.",img:"rr-4-ho"},
  {t:"서류 · 면접 · 최종 결과",p:"후보 행에서 서류 · 면접 · 최종을 골라요. 면접 없이 합격하면 면접을 ‘생략’으로 두세요.",tip:"행 색: 최종 합격 초록 · 불합격 · 지원 취소 회색. 불합격자는 채용파트 ‘연계 검토’로 넘어가요.",img:"rr-5-result"},
  {t:"조율 요청",p:"면접 일정 · 처우 · 입사일 · 서류 보완 · 근무 조건 변경처럼 기업이나 근로자와 주고받을 일은 <span class='kbd'>조율 요청</span> 탭에서 <span class='kbd'>+ 조율 요청</span>으로 남겨요.",tip:"카드마다 ‘기업 요청 / 근로자 요청’ 배지와 지금 누구 차례인지가 보이고, 차례가 된 사람의 할 일에 올라가요.",img:"rr-6-talk"},
  {t:"합격자 계약 정보",p:"최종 합격자의 연락처 · 생년월일 · 이메일 · 계약 기간 · 근무시간을 넣어요. 2명 이상이면 <span class='kbd'>합격자 계약 정보 한 번에</span>로 표에 한 번에 넣어요.",tip:"[모두 같게]로 날짜를 복사하고, 엑셀에서 이름 · 생년월일 · 이메일을 붙여 넣을 수 있어요. 넣은 정보는 입구서 발송에서 불러와요.",img:"rr-7-cib"},
  {t:"채용 완료 (운영파트)",p:"합격자가 모두 입사 등록되면 기업 운영 담당의 할 일에 <span class='kbd'>[채용 완료 확인]</span>이 올라와요. 할 일 창에서 <span class='kbd'>채용 요청 완료</span>를 누르면 끝나요.",tip:"채용 예정 탭에는 ‘입사 절차 완료’ 배지가 붙어요.",img:"rr-8-done"}]},
{id:"onboarding",title:"신규입사 · 입구서",lead:"합격자에게 입구서(입사 서류 안내)를 보내고, 입사 처리까지 관리해요.",
 who:["채용파트 · 입구서 발송","운영파트 · 입사 후 관리"],
 branch:{label:"들어오는 길",opts:["채용 요청에서","직접 등록","연장"],note:{"채용 요청에서":"채용 요청에서 계약 정보를 넣은 최종 합격자를 불러와요.","직접 등록":"채용 요청 없이 오는 입사자예요. [신규입사자 등록] 또는 입구서가 필요 없는 예외(위탁 계약 · 대체 다건 등)는 [입구서 없이 등록]을 써요.","연장":"연장은 새로 등록하지 않아요. 계약만료 창의 [연장 계약 입력] 또는 근로자 창 › 새 계약에서 입사 구분 ‘연장’을 고르면 기존 계약의 다음 차수로 붙어요."}},
 steps:[
  {t:"합격자 불러오기",only:["채용 요청에서"],p:"입구서 발송 › <span class='kbd'>채용 합격자 불러오기</span>로 계약 정보가 들어간 합격자를 가져와요.",img:"in-1-intake"},
  {t:"직접 등록",only:["직접 등록"],p:"<span class='kbd'>신규입사자 등록</span>에서 근로자 · 기업 · 입사 구분 · 계약 기간을 넣으면 입구서가 함께 만들어져요."},
  {t:"다음 차수로 붙이기",only:["연장"],p:"계약만료 창에서 연장(또는 무기계약 전환)으로 확정하면 <span class='kbd'>연장 계약 입력</span>이 떠요. 시작일은 만료 다음 날로 채워져 있어요.",img:"ex-2-ext"},
  {t:"입구서 발송 · 서명",only:["채용 요청에서","직접 등록"],p:"표에서 골라 <span class='kbd'>선택 발송</span>해요. 서명은 모두싸인으로 진행되고, 서명중 → 서명완료가 표에 보여요.",tip:"‘발송 준비’ 칸에 빠진 정보가 빨간 배지로 보여요. 채우면 발송할 수 있어요."},
  {t:"신규입사자 관리",only:["채용 요청에서","직접 등록"],p:"신규입사자 관리에서 입사 진행 메모 · 브이워크 가입 · 브이원 등록 · 입사취소를 관리해요.",img:"in-2-onb"}]},
{id:"exp",title:"계약만료",lead:"만료 60일 전부터 고객사 · 근로자 의사를 확인해 연장 · 종료 · 무기계약 전환을 정해요.",
 who:["운영파트 · 진행","채용파트 · 종료 후 대체 채용"],
 branch:{label:"결정",opts:["연장","종료","무기계약 전환"],note:{"연장":"연장 계약(다음 차수)을 입력해야 ⑥ 전산반영까지 이어져요.","종료":"퇴사일 반영 · 퇴사 서류가 후속으로 생겨요. 자리를 채워야 하면 [대체 채용 요청]을 만들어요.","무기계약 전환":"기간제 2년이 되는 경우예요. 종료일 없는 계약(무기계약)을 입력해요."}},
 steps:[
  {t:"6단계 진행",p:"계약만료 표에서 행을 열면 오른쪽에 ① 안내 메일 → ② 고객사 결정 → ③ 근로자 안내 → ④ 최종 확정 → ⑤ 결과 전달 → ⑥ 전산반영이 있어요. <span class='kbd'>다음 ▶</span>으로 지금 단계를 처리해요.",img:"ex-1-panel"},
  {t:"연장 계약 입력",only:["연장","무기계약 전환"],p:"최종 확정 뒤 창 위에 <span class='kbd'>연장 계약 입력</span>(무기계약은 <span class='kbd'>무기계약 입력</span>)이 떠요. 입력하면 ‘✓ n차 계약 입력됨’으로 바뀌어요.",img:"ex-2-ext"},
  {t:"퇴사 처리 · 대체 채용",only:["종료"],p:"후속 서류(퇴사 서류 · 퇴사일 반영)를 처리하고, 필요하면 표에서 체크한 뒤 <span class='kbd'>대체 채용 요청</span>을 만들어요."},
  {t:"완료",p:"6단계와 후속 서류가 모두 끝나면 진행 중에서 빠지고 ‘완료 조회’로 옮겨져요."}]},
{id:"req",title:"고객사 요청사항",lead:"고객사가 메일 · 전화로 준 요청(교육 · 검진 · 연말정산 · 서류 등)을 근로자별로 기록하고 처리해요.",
 who:["운영파트 · 처리","관리자 · 확인"],
 branch:{label:"요청 범위",opts:["근로자별","기업 전체"],note:{"근로자별":"요청에 근로자를 고르면 사람마다 한 줄씩 생기고, 각자 내 할 일이 돼요.","기업 전체":"근로자 없이 기업 단위로 처리하는 요청이에요(예: 월간 레포트). 처리 내용 기록 하나로 진행해요."}},
 steps:[
  {t:"요청 등록",p:"고객사 요청사항 › <span class='kbd'>요청 등록</span>에서 기업 · 구분 · 내용 · 마감 · 근로자를 넣어요.",img:"rq-2-new"},
  {t:"목록 보기",p:"진행 중 탭에 시작 전 · 진행 중이 먼저, 완료 · 취소는 아래로 보여요. 기한이 지나면 왼쪽에 빨간 막대가 붙어요.",tip:"‘요청별로 묶기’를 켜면 같은 요청의 근로자를 한 줄로 묶어 봐요.",img:"rq-1-list"},
  {t:"근로자별 진행 기록",only:["근로자별"],p:"요청별로 묶은 뒤 행을 열면 <b>근로자별 진행</b>이 있어요. ▸를 누르면 그 근로자의 특이사항 · 처리 기록이 펼쳐지고 바로 적을 수 있어요. 이름을 누르면 근로자 창이 열려요.",tip:"‘고객사 공유’를 체크한 기록은 고객사 메일 진행 현황에 보여요.",img:"rq-3-group"},
  {t:"완료",p:"근로자마다 상태를 ‘완료’로 바꾸거나 <span class='kbd'>남은 n명 모두 완료</span>를 눌러요."}]},
{id:"wreq",title:"근로자 요청사항",lead:"근로자가 직접 요청한 일(서류 · 근무 · 노무 등)을 접수해 처리해요.",who:["운영파트 · 처리"],
