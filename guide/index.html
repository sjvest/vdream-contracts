<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영페이지 도움말</title>
<style>
:root{--ink:#1F1D2B;--ink-2:#6B6880;--line:#E6E3EF;--bg:#F7F6FB;--acc:#5B4BC4;--acc-2:#EEEBFF;--ok:#2E9E5B;--ok-bg:#EEF8F1;--off:#8A8A95;--off-bg:#F3F3F5;--bad:#E5484D}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;margin:0}
.top .sub{color:var(--ink-2);font-size:12.5px}
.top input{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;max-width:1400px;margin:0 auto}
nav{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:14px 10px;border-right:1px solid var(--line);background:#fff}
nav h4{font-size:11.5px;color:var(--ink-2);margin:14px 8px 4px;font-weight:600}
nav a{display:block;padding:5px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
nav a.on{background:var(--acc-2);color:var(--acc);font-weight:600}
nav a:hover{background:var(--bg)}
main{padding:20px 28px 80px;min-width:0}
section{display:none;max-width:1100px}
section.on{display:block}
h2{font-size:21px;margin:4px 0 4px}
.lead{color:var(--ink-2);margin:0 0 14px}
.who{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.who span{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 16px}
.chips b{font-size:12.5px;color:var(--ink-2);margin-right:4px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font:inherit;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bnote{background:var(--acc-2);border-radius:8px;padding:8px 12px;margin:-6px 0 14px;font-size:13.5px}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.step h3{margin:0 0 6px;font-size:15.5px;display:flex;gap:8px;align-items:center}
.step h3 i{font-style:normal;display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:12.5px}
.step p{margin:0 0 8px}
.step .tip{font-size:12.5px;color:var(--ink-2)}
.step img{display:block;max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:zoom-in}
.step.hide{display:none}
.kbd{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 6px;font-size:12.5px}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-size:13.5px}
th{background:var(--bg);font-size:12.5px;color:var(--ink-2)}
td.c,th.c{text-align:center}
.chk{color:var(--ink-2)}
.need{color:#B45309;font-size:12px}
.sw{display:inline-block;width:18px;height:12px;border-radius:2px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
.menus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.menus .m{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.menus .m b{display:block}
.menus .m span{color:var(--ink-2);font-size:13px}
.zoom{position:fixed;inset:0;background:rgba(20,18,30,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.foot{color:var(--ink-2);font-size:12px;margin-top:30px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}nav h4{width:100%;margin:6px 4px 0}main{padding:16px}.top input{min-width:0;width:40%}}
</style>
</head>
<body>
<div class="top"><h1>운영페이지 도움말</h1><span class="sub">메뉴마다 어떻게 진행되는지 · v269 기준 · 화면은 예시 데이터 (이름은 가명)</span><input id="q" placeholder="찾기 (예: 연장, 처우 협의, 대체, 원본)" aria-label="찾기"></div>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
(function(){
"use strict";
var IMG="img/";
/* ---------- 흐름 가이드 ---------- */
var FLOWS=[
{id:"rreq",title:"채용 요청",lead:"고객사 채용 요청을 받아 후보를 찾고, 운영파트가 고객사에 전달하고, 합격자가 입사할 때까지예요.",
 who:["채용파트 · 후보 찾기 · 결과 입력 · 처우 협의 회신","운영파트 · 고객사 전달 · 완료 확인","영업 · 사전 공유","발굴파트 · 인재 추천"],
 branch:{label:"채용 구분",opts:["신규","추가","대체"],note:{"신규":"새 고객사 채용이에요. 영업 홈 사전 공유에서 ‘계약완료’를 누르면 채용 요청이 자동으로 만들어져요. 같은 기업에 진행 중인 채용 요청이 있으면 ‘기존 건에 연결 / 새로 만들기’를 먼저 물어요.","추가":"이미 근무 중인 고객사의 인원 추가예요. 등록할 때 기업 DB에서 기업을 골라요.","대체":"그만두는 근로자의 자리를 채우는 채용이에요. 대체 대상 1명이 1줄이고, 근무 조건은 그 사람의 입사 때 채용 요청에서 가져와요(조건 출처가 표시돼요). 계약만료 · 중도퇴사에서 [대체 채용 요청]으로 만들면 대상이 채워져요."}},
 steps:[
  {t:"채용 요청 등록",p:"채용 요청 › <span class='kbd'>+ 채용 요청</span>에서 기업 · 구분 · 직무 · 근무 조건 · 마감을 넣어요. 하루 4시간 이상이면 휴게 30분이 자동으로 들어가요(8시간이면 1시간). 휴게는 직접 넣을 수도 있어요.",tip:"급여 ‘최저시급’은 요청의 입사일 연도 최저시급으로 계산해요(관리자 › 설정 › 최저시급에서 올해 · 내년 금액 관리). 기업 DB에 없는 기업은 [기업 DB에 없는 기업]으로 이름만 넣고, 나중에 기업 DB에 등록해 연결해요.",img:"rr-1-form"},
  {t:"대체 요청 합치기",only:["대체"],p:"같은 기업에 진행 중인 대체 요청이 있으면 만들 때 <span class='kbd'>여기에 합치기</span> / <span class='kbd'>새로 따로 만들기</span>를 물어요. 이미 따로 만든 2건은 요청 창에서 <span class='kbd'>합치기</span>로 하나로 만들 수 있어요.",tip:"다른 요청에 들어가 있는 사람은 <span class='kbd'>이 요청으로 가져오기</span> · <span class='kbd'>저 요청으로 보내기</span>로 옮겨요. 합쳐서 빈 요청은 지우지 않고 ‘취소’로 남아요."},
  {t:"후보 넣기",p:"요청 창 › 후보 · 차수 탭의 차수 카드에서 <span class='kbd'>+ 후보자</span>(직접) · <span class='kbd'>+ 계약만료자에서</span> · <span class='kbd'>+ 인재에서</span>로 넣어요.",tip:"연락처와 이름이 근로자 DB · 인재 풀 · 포트폴리오와 같으면 자동으로 연결돼요. 후보를 체크하고 [다른 차수로 옮기기]로 차수를 바꿀 수 있어요(원래 차수에는 회색 줄로 남아요).",img:"rr-2-cand"},
  {t:"발굴파트 추천 확인",p:"발굴파트가 추천한 인재는 ‘발굴파트 추천’에 검토 대기로 와요. <span class='kbd'>후보로 추가</span>하면 채용 요청 직무와 연락처로 최근 차수에 들어가요.",tip:"최종 합격자가 있거나 이력서 전달이 끝나면 추천 상자가 한 줄로 접혀요. 줄을 누르면 펼쳐져요. 처리한 추천은 ‘처리 완료’로 접혀요(최근 30일).",img:"rr-3-orec"},
  {t:"운영파트에 이력서 전달",p:"후보를 다 넣으면 <span class='kbd'>운영파트에게 이력서 전달</span>을 눌러요. 그 전에는 ‘운영 전달 전’으로 보이고 운영파트 할 일에 올라가지 않아요.",tip:"운영파트가 고객사에 보내면 ‘이력서 전달’ 날짜가 채워져요.",img:"rr-4-ho"},
  {t:"서류 · 면접 · 최종 결과",p:"후보 행에서 서류 · 면접 · 최종을 골라요. 면접 없이 합격하면 면접을 ‘생략’으로 두세요.",tip:"행 색: 최종 합격 초록 · 불합격 · 지원 취소 회색.",img:"rr-5-result"},
  {t:"불합격 연계",p:"채용 요청 › <span class='kbd'>불합격 연계</span> 탭에서 불합격자를 줄마다 <span class='kbd'>다른 요청에 넣기 ▾</span> · <span class='kbd'>인재 풀에 남기기</span> · <span class='kbd'>연계 안 함 ▾</span>으로 처리해요.",tip:"여러 명을 체크해 한 번에 처리할 수 있고, 처리 직후 5초 안에는 되돌릴 수 있어요. 불합격 뒤 지난 날짜와 그 요청의 충원 결과도 같이 보여요."},
  {t:"조율 요청",p:"면접 일정 · 처우 협의 · 입사일 · 서류 보완 · 근무 조건 변경처럼 기업이나 근로자와 주고받을 일은 <span class='kbd'>조율 요청</span> 탭에서 <span class='kbd'>+ 조율 요청 만들기</span>로 남겨요.",tip:"면접 일정은 가능한 일시를 넣으면 후보별 정리 표가 만들어지고, 한 번에 확정할 수 있어요. 서류 보완은 고객사 양식을 첨부해요. 카드마다 ‘고객사 요청 / 근로자 요청’과 지금 누구 차례인지가 보이고, 차례가 된 사람의 할 일에 올라가요.",img:"rr-6-talk"},
  {t:"처우 협의",p:"조율 요청 종류를 ‘처우 협의’로 고르면 입사일 · 근로시간 · 근무 요일 · 급여 · 기타 중 협의할 항목이 채용 요청 조건으로 미리 채워져요. 항목마다 <span class='kbd'>선택</span>(여러 안 중 고르기) 또는 <span class='kbd'>동의</span>(한 안에 동의 받기)를 정해요.",tip:"고객사 확인 요청을 받은 운영파트가 <span class='kbd'>채용파트에 넘기기 →</span>를 누르면 채용파트가 후보에게 받아 후보별 회신을 적어요. 회신이 끝나면 합격자 계약 정보의 기본값(근로시간 · 근무 요일 · 입사일)으로 들어가요. 처우 협의는 채널톡 알림이 기본으로 꺼져 있어요."},
  {t:"합격자 계약 정보",p:"최종 합격자의 연락처 · 생년월일 · 이메일 · 계약 기간 · 근무시간 · 근무 요일을 넣어요. 2명 이상이면 <span class='kbd'>합격자 계약 정보 한 번에</span>로 표에 한 번에 넣어요.",tip:"근로계약서는 기업에 등록된 공용 양식 중 조건(직무 · 근무 요일 등)에 맞는 것이 ★ 추천으로 떠요. [★ 추천대로 적용] 또는 [개별 파일로 바꾸기]를 써요. 넣은 정보는 입구서 발송에서 불러와요.",img:"rr-7-cib"},
  {t:"채용 완료 (운영파트)",p:"합격자가 모두 입사 등록되고 입구서가 전원 완료되면 기업 운영 담당의 할 일에 <span class='kbd'>[채용 완료 확인]</span>이 올라와요. 할 일 창에서 <span class='kbd'>채용 요청 완료</span>를 누르면 끝나요.",tip:"채용 예정 탭에는 ‘입사 절차 완료’ 배지가 붙어요.",img:"rr-8-done"}]},
{id:"onboarding",title:"신규입사 · 입구서",lead:"합격자에게 입구서(입사 서류 안내)를 보내고, 입사 처리까지 관리해요.",
 who:["채용파트 · 입구서 발송 · 신규입사자 정보 입력","운영파트 · 입사 후 관리"],
 branch:{label:"들어오는 길",opts:["채용 요청에서","직접 등록","연장"],note:{"채용 요청에서":"채용 요청에서 계약 정보를 넣은 최종 합격자를 불러와요.","직접 등록":"채용 요청 없이 오는 입사자예요. [신규입사자 등록] 또는 입구서가 필요 없는 예외(위탁 계약 · 대체 다건 등)는 [입구서 없이 등록]을 써요.","연장":"연장은 새로 등록하지 않아요. 계약만료 창의 [연장 계약 입력] 또는 근로자 창 › 새 계약에서 입사 구분 ‘연장’을 고르면 기존 계약의 다음 차수로 붙어요."}},
 steps:[
  {t:"합격자 불러오기",only:["채용 요청에서"],p:"입구서 발송 › <span class='kbd'>채용 합격자 불러오기</span>로 계약 정보가 들어간 합격자를 가져와요.",img:"in-1-intake"},
  {t:"직접 등록",only:["직접 등록"],p:"<span class='kbd'>신규입사자 등록</span>에서 근로자 · 기업 · 입사 구분 · 계약 기간을 넣으면 입구서가 함께 만들어져요."},
  {t:"다음 차수로 붙이기",only:["연장"],p:"계약만료 창에서 연장(또는 무기계약 전환)으로 확정하면 <span class='kbd'>연장 계약 입력</span>이 떠요. 시작일은 만료 다음 날로 채워져 있어요.",img:"ex-2-ext"},
  {t:"입구서 발송 · 서명",only:["채용 요청에서","직접 등록"],p:"표에서 골라 <span class='kbd'>선택 발송</span>해요. 서명은 모두싸인으로 진행되고, 서명중 → 서명완료가 표에 보여요.",tip:"‘발송 준비’ 칸에 빠진 정보가 빨간 배지로 보여요. 채우면 발송할 수 있어요. 한 기업의 입구서가 전원 완료되면 운영파트에 한 번 알려요(사람별 알림은 없어요)."},
  {t:"신규입사자 정보 입력",only:["채용 요청에서","직접 등록"],p:"주소 · 생년월일 · 연락처 · 장애 정보 · 재판정일이 빠진 신규입사자는 채용파트 할 일 ‘신규입사자 정보 입력’에 올라오고, 근로자 창에 노란 칸으로 보여요."},
  {t:"신규입사자 관리",only:["채용 요청에서","직접 등록"],p:"신규입사자 관리에서 입사 진행 메모 · 브이워크 가입 · 브이원 등록 · 입사취소를 관리해요.",tip:"조회 기준은 등록일 · 브이워크 시작일 · 계약시작일 중에서 골라요.",img:"in-2-onb"}]},
{id:"exp",title:"계약만료",lead:"만료 60일 전부터 고객사 · 근로자 의사를 확인해 연장 · 종료 · 무기계약 전환을 정해요.",
 who:["운영파트 · 진행","채용파트 · 종료 후 대체 채용"],
 branch:{label:"결정",opts:["연장","종료","무기계약 전환"],note:{"연장":"연장 계약(다음 차수)을 입력해야 ⑥ 전산반영까지 이어져요.","종료":"퇴사일 반영 · 퇴사 서류가 후속으로 생겨요. 자리를 채워야 하면 [대체 채용 요청]을 만들어요.","무기계약 전환":"기간제 2년이 되는 경우예요. 종료일 없는 계약(무기계약)을 입력해요."}},
 steps:[
  {t:"6단계 진행",p:"계약만료 표에서 행을 열면 오른쪽에 ① 안내 메일 → ② 고객사 결정 → ③ 근로자 안내 → ④ 최종 확정 → ⑤ 결과 전달 → ⑥ 전산반영이 있어요. <span class='kbd'>다음 ▶</span>으로 지금 단계를 처리해요.",tip:"필요 없는 단계는 건너뛸 수 있어요. 고객사가 회신하지 않으면 [통보 완료]로 최종 확정까지 이어가요. 여러 건은 표에서 체크해 일괄 처리(입력 한 번 · 미리보기)해요. 창 왼쪽에 근로자 특이사항 · 기업 메모가 접혀 있어요.",img:"ex-1-panel"},
  {t:"연장 계약 입력",only:["연장","무기계약 전환"],p:"최종 확정 뒤 창 위에 <span class='kbd'>연장 계약 입력</span>(무기계약은 <span class='kbd'>무기계약 입력</span>)이 떠요. 입력하면 ‘✓ n차 계약 입력됨’으로 바뀌어요.",img:"ex-2-ext"},
  {t:"퇴사 처리 · 대체 채용",only:["종료"],p:"후속 서류(퇴사 서류 · 퇴사일 반영)를 처리하고, 필요하면 표에서 체크한 뒤 <span class='kbd'>대체 채용 요청</span>을 만들어요.",tip:"표의 ‘대체’ 칸에서 대체 채용이 진행 중인지, 누구로 대체됐는지 볼 수 있어요. 근로자 DB의 끝난 계약에도 같은 표시가 붙어요."},
  {t:"완료",p:"6단계와 후속 서류가 모두 끝나면 진행 중에서 빠지고 ‘완료 조회’로 옮겨져요."}]},
{id:"lea",title:"중도퇴사",lead:"계약 기간 중에 그만두는 근로자의 퇴사 의사 · 마지막 근무일 · 퇴사 서류 · 대체 채용을 관리해요.",
 who:["운영파트 · 진행","채용파트 · 대체 채용"],
 branch:{label:"대체 채용",opts:["진행","안 함","철회"],note:{"진행":"자리를 채워야 하면 대체 채용 요청을 만들어요. 대상과 근무 조건이 채워져요.","안 함":"대체하지 않기로 했으면 그렇게 기록해 둬요. 나중에 다시 정할 수 있어요.","철회":"근로자가 퇴사를 철회하면, 이미 만든 대체 채용 요청은 자동으로 취소돼요."}},
 steps:[
  {t:"퇴사 의사 접수",p:"중도퇴사에서 근로자 · 퇴사 사유 · 마지막 근무일을 넣어요. 근로자 창에서도 퇴사일 변경 · 철회 버튼을 바로 쓸 수 있어요."},
  {t:"퇴사 서류",p:"퇴사 서류는 서류 관리와 같은 단계로 진행해요. 필요 없는 단계는 건너뛸 수 있어요."},
  {t:"대체 채용 정하기",only:["진행","안 함"],p:"중도퇴사 창의 대체 채용 줄에서 <span class='kbd'>대체 채용 요청</span> 또는 <span class='kbd'>대체 안 함</span>을 눌러요. 정한 뒤에는 <span class='kbd'>다시 정하기</span>로 바꿀 수 있어요.",tip:"목록의 ‘대체’ 칸에 진행 중 · 누구로 대체됨 · 대체 안 함이 보여요. 아직 정하지 않은 건은 창에 대체 채용 줄이 비어 있어요."},
  {t:"퇴사 철회",only:["철회"],p:"근로자 창 또는 중도퇴사 창에서 철회하면 퇴사가 취소되고, 연결된 대체 채용 요청도 취소돼요."}]},
{id:"req",title:"고객사 요청사항",lead:"고객사가 메일 · 전화로 준 요청(교육 · 검진 · 연말정산 · 서류 등)을 근로자별로 기록하고 처리해요.",
 who:["운영파트 · 처리","관리자 · 확인"],
 branch:{label:"요청 범위",opts:["근로자별","기업 전체","여러 기업"],note:{"근로자별":"요청에 근로자를 고르면 사람마다 한 줄씩 생기고, 각자 내 할 일이 돼요.","기업 전체":"근로자 없이 기업 단위로 처리하는 요청이에요(예: 월간 레포트). 처리 내용 기록 하나로 진행해요.","여러 기업":"같은 기업명(부서) · 같은 그룹 기업에 같은 요청을 올릴 때예요. 기업별로 따로 올리거나, 묶어서 한 건(🔗 n곳)으로 올려요."}},
 steps:[
  {t:"요청 등록",p:"고객사 요청사항 › <span class='kbd'>요청 등록</span>에서 기업 · 구분 · 내용 · 마감 · 근로자를 넣어요.",img:"rq-2-new"},
  {t:"같이 올리기",only:["여러 기업"],p:"등록 창의 기업 표에서 같은 부서 · 같은 그룹 기업을 고르면 재직자 전원이 들어가요. 일부만 빼려면 펼쳐서 빼요. ‘기업별 따로 / 묶어서 한 건’을 골라요."},
  {t:"목록 보기",p:"진행 중 탭에 시작 전 · 진행 중이 먼저, 완료 · 취소는 아래로 보여요. 기한이 지나면 왼쪽에 빨간 막대가 붙어요.",tip:"위의 보기 막대로 목록 · 근로자별 · 기업별 · 업무별 · 일자별로 바꿔 보고, ‘요청별’을 켜면 같은 요청의 근로자를 한 줄로 묶어 봐요.",img:"rq-1-list"},
  {t:"근로자별 진행 기록",only:["근로자별","여러 기업"],p:"요청별로 묶은 뒤 행을 열면 <b>근로자별 진행</b>이 있어요. ▸를 누르면 그 근로자의 특이사항 · 처리 기록이 펼쳐지고 바로 적을 수 있어요. 이름을 누르면 근로자 창이 열려요.",tip:"‘고객사 공유’를 체크한 기록은 고객사 메일 진행 현황에 보여요.",img:"rq-3-group"},
  {t:"완료",p:"근로자마다 상태를 ‘완료’로 바꾸거나 <span class='kbd'>남은 n명 모두 완료</span>를 눌러요."}]},
{id:"wreq",title:"근로자 요청사항",lead:"근로자가 직접 요청한 일(서류 · 근무 · 노무 등)을 접수해 처리해요.",who:["운영파트 · 처리"],
 steps:[{t:"접수 → 진행 중 → 완료",p:"근로자 요청사항에서 행을 열어 상태를 바꾸고 처리 내용을 기록해요. 노무 이슈면 ‘노무 이슈’를 체크해요.",img:"wr-1-panel"}]},
{id:"docs",title:"입사 · 퇴사 서류",lead:"근로계약서 등 서류를 받는 과정을 단계별로 체크해요.",who:["운영파트 · 서류 진행","채용파트 · 입사 서류 안내 · 근로계약서 첨부"],
 branch:{label:"제출 방식",opts:["PDF 모두싸인","원본"],note:{"PDF 모두싸인":"전자서명이에요. 3단계예요.","원본":"우편으로 원본을 주고받아요. 5단계 + 필요하면 여러 번 주고받기."}},
 steps:[
  {t:"모두싸인 3단계",only:["PDF 모두싸인"],p:"① 모두싸인 요청 → ② 서명 완료 확인 → ③ 파일 저장. 단계 번호를 눌러 체크해요.",tip:"필요 없는 단계는 건너뛸 수 있어요. 여러 건은 일괄 처리해요.",img:"dc-2-pdf"},
  {t:"원본 5단계",only:["원본"],p:"① 안내 → ② 발송 안내 → ③ 발송 → ④ 서류 수취 → ⑤ 고객사 전달. 차례가 근로자인 단계는 내 할 일에 ‘대기 중’으로 보여요."},
  {t:"원본 주고받기",only:["원본"],p:"직인 날인 등으로 근로자 · 고객사와 여러 번 오가야 하면 <b>원본 주고받기</b>에서 <span class='kbd'>근로자에게 보냄</span> · <span class='kbd'>고객사에 보냄</span> · <span class='kbd'>받음</span> · <span class='kbd'>보완 요청</span>을 기록해요. 지금 누구 차례인지 보이고, <span class='kbd'>원본 처리 끝</span>을 눌러야 완료돼요.",tip:"단계의 운송장 번호와 주고받기 기록은 하나로 이어져요. 퇴사 서류도 같은 방식이에요.",img:"dc-1-org"}]},
{id:"talent",title:"인재 풀 · 포트폴리오",lead:"채용에 연결할 인재(추천 · 포트폴리오)를 한곳에서 보고, 상태를 관리해요.",who:["채용파트 · 관리 · 연계","발굴파트 · 추천"],
 branch:{label:"탭",opts:["대기","진행 중","완료 조회"],note:{"대기":"아직 채용 요청에 연결하지 않은 인재예요.","진행 중":"이력서 전달 · 면접 · 처우 협의 · 입사 대기 4단계로 나눠 보여요.","완료 조회":"연계완료 · 반려 등 끝난 인재예요. 검색은 진행 중 · 완료 전체에서 찾아요."}},
 steps:[
  {t:"인재 창",p:"이름을 누르면 머리 카드와 탭(요약 · 희망 조건 · 서류 · 파일 · 연계 기록 · 메모 · 기타)이 열려요. 추천과 포트폴리오가 한 창에 같이 보이고 상태는 하나예요.",tip:"근로자 DB와 연결된 사람은 칩이 붙고, 두 기록의 값이 다르면 ‘값 다름’ 칩이 떠요. 근로자 창에서는 인재 풀에 있는 사람만 줄 끝에 [인재 풀 →]이 보여요."},
  {t:"새 포트폴리오 등록",p:"필수 칸만 넣으면 돼요. 연락처 · 생년월일 중 하나는 꼭 넣어야 해요.",tip:"같은 이름이 이미 있으면 <span class='kbd'>이 사람이에요 · 연결</span> / <span class='kbd'>다른 사람이에요 · 그대로 등록</span>을 물어요."},
  {t:"같은 사람 확인",p:"추천과 포트폴리오에 같은 사람으로 보이는 기록이 있으면 <span class='kbd'>같은 사람 확인</span>이 떠요. <span class='kbd'>같은 사람 · 묶기</span> 또는 <span class='kbd'>다른 사람</span>을 골라요."},
  {t:"채용 연계",p:"채용 요청의 <span class='kbd'>+ 인재에서</span>로 후보에 넣으면 진행 중으로 바뀌어요. 근로자 DB에 연결된 인재가 입사하면 자동으로 연계완료가 돼요."}]},
{id:"dis",title:"장애 재판정",lead:"장애 재판정일이 다가온 근로자에게 안내하고, 확인서류를 받아 기록해요.",who:["운영파트 · 진행","채용파트 · 신규입사자 장애 정보 입력"],
 steps:[
  {t:"재판정 대상 보기",p:"장애 재판정에서 재판정일이 가까운 근로자를 봐요. 장애 정보가 비어 있는 사람은 ‘미입력’에 따로 보여요.",tip:"11/5 이후 등록된 신규입사자의 장애 정보는 채용파트 할 일(신규입사자 정보 입력)로 가고, 그 전에 등록된 인원은 운영파트가 여기서 관리해요."},
  {t:"확인서류 받기",p:"확인서류를 <span class='kbd'>복지카드</span> | <span class='kbd'>판정서류</span> 중 하나로 고르고, 수취채널 · 수취일을 넣어요. 재판정 기록에 수취 이력과 최근 수취가 남아요."}]},
{id:"comp",title:"기업 DB · 기업 메모",lead:"기업 정보 · 담당 · 서류 양식과, 기업을 다룰 때 알아 둘 특이사항 · 메모를 관리해요.",who:["운영파트 · 관리","모든 파트 · 참고"],
 steps:[
  {t:"기업 특이사항",p:"기업 창의 특이사항은 범위(그룹 · 기업 · 부서)별 목록이에요. 입력칸에 쓰고 Enter로 등록해요(Shift+Enter는 줄바꿈). 다른 메뉴의 창에서는 한 칸으로 요약해 보여요.",tip:"고치기는 ✎, 지우기는 ×예요. 누가 언제 썼는지 함께 남아요."},
  {t:"기업 메모 같이 등록",p:"진행 · 변동 기록(기업 메모)을 쓸 때 같은 그룹 계열사를 체크하면 여러 기업에 한 번에 남겨요. 같이 등록한 메모에는 🔗 표시가 붙어요."},
  {t:"근로계약서 공용 양식",p:"기업 창 › <span class='kbd'>양식 관리</span>에서 직무 · 근무 요일 · 근로시간 같은 조건과 함께 공용 근로계약서를 <span class='kbd'>양식 등록</span>해요. 합격자 계약 정보에서 조건이 맞는 양식이 ★ 추천으로 떠요."},
  {t:"임시 담당자 (영업 기업)",p:"영업이 담당자 지정을 요청하면 운영파트 관리자가 임시 담당자를 정해요. 임시 담당자의 ‘내 담당’에 같이 보이고, 30일이 지나면 이관 진행 알림이 와요."}]},
{id:"orec",title:"발굴 추천 → 후보",lead:"발굴파트가 기관에서 받은 인재를 채용 요청에 추천하면, 채용파트가 후보로 넣거나 보류해요.",who:["발굴파트 · 추천","채용파트 · 검토"],
 branch:{label:"처리",opts:["후보로 추가","보류","되돌리기 · 반려"],note:{"후보로 추가":"채용 요청 직무 · 연락처로 최근 차수에 들어가요.","보류":"지금은 넣지 않아요. 발굴파트 화면에 보류로 보여요.","되돌리기 · 반려":"이미 넣은 후보를 빼요. 서류 · 면접 · 결과가 있는 후보는 뺄 수 없어요."}},
 steps:[
  {t:"추천 도착",p:"채용 요청 창 › ‘발굴파트 추천’에 검토 대기로 와요. 채용파트 할 일에도 ‘발굴 추천 검토’로 올라와요.",tip:"추천 상자가 접혀 있으면 한 줄 요약을 눌러 펼쳐요.",img:"or-1-box"},
  {t:"후보 행 ✕",only:["되돌리기 · 반려"],p:"후보 행 오른쪽 <span class='kbd'>✕</span>를 누르면 <b>발굴 추천으로 되돌리기</b>(다시 검토 대기) 또는 <b>반려</b>(사유: 직무 불일치 · 조건 불일치 · 중복 · 기타)를 골라요.",img:"or-2-x"}]},

H+='<section id="s-menus"><h2>메뉴 한눈에</h2><p class="lead">메뉴마다 화면 제목 옆 <span class="kbd">?</span>를 누르면 이 도움말이 열려요.</p><div class="menus">'+MENUS.map(function(m){return'<div class="m" id="m-'+m[0]+'"><b>'+esc(m[1])+'</b><span>'+esc(m[2])+'</span>'+(MAP[m[0]]?' <a href="#'+MAP[m[0]]+'">가이드 보기</a>':"")+'</div>'}).join("")+'</div></section>';
FLOWS.forEach(function(f){var B=f.branch;H+='<section id="s-'+f.id+'" data-flow="'+f.id+'"><h2>'+esc(f.title)+'</h2><p class="lead">'+esc(f.lead)+'</p><div class="who">'+f.who.map(function(w){return'<span>'+esc(w)+'</span>'}).join("")+'</div>'+
  (B?'<div class="chips"><b>'+esc(B.label)+'</b>'+B.opts.map(function(o,i){return'<button type="button" data-br="'+esc(o)+'"'+(i===0?' class="on"':"")+'>'+esc(o)+'</button>'}).join("")+'</div><div class="bnote"></div>':"")+
  f.steps.map(function(s,i){return'<div class="step" data-only="'+esc((s.only||[]).join("|"))+'"><h3><i>'+(i+1)+'</i>'+esc(s.t)+'</h3><p>'+s.p+'</p>'+(s.tip?'<p class="tip">'+esc(s.tip)+'</p>':"")+(s.img?'<img loading="lazy" src="'+IMG+s.img+'.png" alt="'+esc(s.t)+' 화면 예시">':"")+'</div>'}).join("")+'</section>'});
H+='<p class="foot">v269 기준 · 화면은 예시 데이터로 자동으로 찍어요 (이름은 가명) · 빨간 테두리 = 누를 곳</p>';
main.innerHTML=H;
function setBranch(sec,v){var f=FLOWS.find(function(x){return x.id===sec.dataset.flow});[].forEach.call(sec.querySelectorAll(".chips button"),function(b){b.classList.toggle("on",b.dataset.br===v)});var n=sec.querySelector(".bnote");if(n&&f.branch)n.textContent=f.branch.note[v]||"";
  var k=0;[].forEach.call(sec.querySelectorAll(".step"),function(st){var o=st.dataset.only;var show=!o||o.split("|").indexOf(v)>=0;st.classList.toggle("hide",!show);if(show){k++;st.querySelector("h3 i").textContent=k}})}
[].forEach.call(document.querySelectorAll("section[data-flow]"),function(sec){var b=sec.querySelector(".chips button");if(b)setBranch(sec,b.dataset.br)});
main.addEventListener("click",function(e){var b=e.target.closest(".chips button");if(b){setBranch(b.closest("section"),b.dataset.br);return}var im=e.target.closest(".step img");if(im){var z=document.getElementById("zoom");z.querySelector("img").src=im.src;z.classList.add("on")}});
document.getElementById("zoom").addEventListener("click",function(){this.classList.remove("on")});
function show(){var h=decodeURIComponent((location.hash||"#menus").slice(1)),parts=h.split("/"),id=parts[0];if(MAP[id])id=MAP[id];var sec=document.getElementById("s-"+id);var mid=null;if(!sec){sec=document.getElementById("s-menus");mid="m-"+parts[0]}
  [].forEach.call(document.querySelectorAll("section"),function(s){s.classList.toggle("on",s===sec)});[].forEach.call(nav.querySelectorAll("a"),function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+sec.id.slice(2))});
  if(parts[1]&&sec.dataset.flow)setBranch(sec,parts[1]);window.scrollTo(0,0);if(mid){var m=document.getElementById(mid);if(m){m.style.outline="2px solid #5B4BC4";m.scrollIntoView({block:"center"})}}}
window.addEventListener("hashchange",show);show();
document.getElementById("q").addEventListener("input",function(){var q=this.value.trim();if(!q)return show();var hit=null;[].some.call(document.querySelectorAll("section"),function(s){if(s.textContent.indexOf(q)>=0){hit=s;return true}});if(hit){[].forEach.call(document.querySelectorAll("section"),function(s){s.classList.toggle("on",s===hit)});[].forEach.call(hit.querySelectorAll(".step"),function(st){if(st.textContent.indexOf(q)>=0)st.classList.remove("hide")})}});
})();
</script>
</body>
</html>
